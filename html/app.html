<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data Noodler</title>
<script>
// Old shell address (app.html?m=<module>&project=...): every module now opens as its own page with the global header.
(() => {
  const q = new URLSearchParams(location.search), m = q.get('m') || 'home'; q.delete('m');
  const page = /^[a-z-]+$/.test(m) ? m : 'home';
  location.replace(`/html/${page}.html${q.size ? `?${q}` : ''}`);
})();
</script>
</head>
<body></body>
</html>
