<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apex Test</title>
<script src="../js/core/no-autofill.js"></script>
<link rel="stylesheet" href="../css/theme.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  .wrap { height: 100%; display: grid; grid-template-columns: minmax(300px, 1fr) minmax(360px, 1.4fr) 320px; gap: 12px; padding: 12px; box-sizing: border-box; }
  .col { min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  .col h2 { margin: 0; }
  #code { flex: 1; min-height: 0; resize: none; font: 13px/19px var(--mono); padding: 8px 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; white-space: pre; tab-size: 2; height: auto; }
  #msg { font-size: 12px; color: var(--muted); min-height: 16px; }
  #msg.err { color: var(--err); }
  #chart { flex: 1; min-height: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 8px; overflow: hidden; }
  #opts { flex: 1; min-height: 0; overflow: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 4px 12px 12px; }
  #opts h3 { margin: 12px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-2); }
  .opt { display: flex; align-items: center; gap: 8px; min-height: 28px; }
  .opt span { flex: 1; min-width: 0; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opt input[type=text], .opt select { width: 130px; }
  .opt input[type=number] { width: 80px; }
  .opt input[type=color] { width: 36px; height: 24px; padding: 0; border: 1px solid var(--border); background: none; }
</style>
</head>
<body>
<!-- Stand-alone ApexCharts test page (no server API needed): paste an ApexCharts demo on the left, see it in the middle,
     tweak the settings it contains on the right. Changing a setting rewrites the code. -->
<div class="wrap">
  <div class="col">
    <h2>Code <span class="spacer"></span></h2>
    <textarea id="code" spellcheck="false"></textarea>
    <div class="row"><button id="fmt" class="ghost small">Format</button><button id="copy" class="ghost small">Copy JSON</button></div>
    <div id="msg"></div>
  </div>
  <div class="col">
    <h2>Preview</h2>
    <div id="chart"></div>
  </div>
  <div class="col">
    <h2>Settings in the code</h2>
    <div id="opts"></div>
  </div>
</div>

<script src="../js/vendor/apexcharts.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const START = `var options = {
  series: [{ name: 'Sign-ups', data: [210, 380, 340, 520, 480, 610, 700, 880, 820, 1040, 1180, 1520] }],
  chart: { type: 'line', zoom: { enabled: false } },
  dataLabels: { enabled: false },
  stroke: { curve: 'straight', width: 3 },
  title: { text: 'New Sign-ups by Month', align: 'left' },
  xaxis: { categories: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], axisBorder: { show: true } },
  yaxis: { axisBorder: { show: true } },
  colors: ['#3987e5']
};`;

// Choices for settings that take one of a few words.
const CHOICES = {
  'chart.type': ['line', 'area', 'bar', 'pie', 'donut', 'radialBar', 'scatter', 'bubble', 'heatmap', 'radar', 'polarArea', 'treemap'],
  curve: ['straight', 'smooth', 'monotoneCubic', 'stepline'], align: ['left', 'center', 'right'], horizontalAlign: ['left', 'center', 'right'],
  position: ['top', 'right', 'bottom', 'left'], lineCap: ['butt', 'square', 'round'], shape: ['circle', 'square', 'rect'],
  type: ['solid', 'gradient', 'pattern', 'category', 'datetime', 'numeric'], mode: ['light', 'dark'], theme: ['light', 'dark'],
};
const SKIP = new Set(['series', 'labels', 'categories', 'data', 'formatter', 'events']);

// ---- read the code: JSON, or a pasted JS snippet (takes the first { ... }) ----
function firstObject(t) {
  const i = t.indexOf('{'); if (i < 0) return t;
  let d = 0, q = null;
  for (let k = i; k < t.length; k++) {
    const c = t[k];
    if (q) { if (c === '\\') k++; else if (c === q) q = null; continue; }
    if (c === '"' || c === "'" || c === '`') q = c;
    else if (c === '/' && t[k + 1] === '/') { const n = t.indexOf('\n', k); k = n < 0 ? t.length : n; }
    else if (c === '{') d++;
    else if (c === '}' && --d === 0) return t.slice(i, k + 1);
  }
  return t.slice(i);
}
const read = text => new Function(`"use strict"; return (${firstObject(text)});`)();

// ---- theme defaults (from css/theme.css) under the pasted options ----
function theme() {
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  return { chart: { background: 'transparent', foreColor: v('--text-2'), fontFamily: "'Exo 2', system-ui, sans-serif", toolbar: { show: false } },
    theme: { mode: 'dark' }, grid: { borderColor: v('--border'), strokeDashArray: 3 }, tooltip: { theme: 'dark' },
    xaxis: { axisBorder: { color: v('--border') }, axisTicks: { color: v('--border') } }, yaxis: { axisBorder: { color: v('--border') } } };
}
const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
// Copy (keeps functions): ApexCharts writes into the options it is given, which must not leak back into the code.
const copy = o => Array.isArray(o) ? o.map(copy) : isObj(o) ? Object.fromEntries(Object.entries(o).map(([k, v]) => [k, copy(v)])) : o;
const deep = (a, b) => { const out = { ...a }; for (const [k, v] of Object.entries(b || {})) out[k] = isObj(v) && isObj(a?.[k]) ? deep(a[k], v) : v; return out; };

// ---- draw ----
let chart = null, opts = null;
async function draw() {
  try { opts = read($('code').value); } catch (e) { $('msg').textContent = 'Code error: ' + e.message; $('msg').className = 'err'; return; }
  $('msg').textContent = 'OK'; $('msg').className = '';
  const box = $('chart'), o = deep(theme(), copy(opts));
  o.chart = { ...o.chart, height: box.clientHeight - 16, width: '100%' };
  try { chart?.destroy(); } catch {}
  box.innerHTML = '';
  try { chart = new ApexCharts(box, o); await chart.render(); } catch (e) { $('msg').textContent = 'Chart error: ' + e.message; $('msg').className = 'err'; }
  settings();
}

// ---- settings panel: every true/false, number, colour, word in the code ----
const get = (o, p) => p.split('.').reduce((a, k) => a?.[k], o);
function set(o, p, v) { const ks = p.split('.'); let a = o; ks.slice(0, -1).forEach(k => a = a[k]); a[ks.at(-1)] = v; }
function settings() {
  const list = [];
  const walk = (node, path) => {
    if (Array.isArray(node)) return node.forEach((v, i) => typeof v !== 'object' && walk(v, `${path}.${i}`));
    if (isObj(node)) return Object.entries(node).forEach(([k, v]) => !SKIP.has(k) && typeof v !== 'function' && walk(v, path ? `${path}.${k}` : k));
    list.push({ path, value: node });
  };
  walk(opts, '');
  const groups = new Map();
  for (const it of list) { const g = it.path.split('.')[0]; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(it); }
  let h = '';
  for (const [g, items] of groups) {
    h += `<h3>${g}</h3>`;
    for (const { path, value } of items) {
      const key = path.split('.').at(-1), name = path.split('.').slice(1).join(' ') || g, ch = CHOICES[path] || CHOICES[key];
      let ctl;
      if (typeof value === 'boolean') ctl = `<input type="checkbox" data-p="${path}" ${value ? 'checked' : ''}>`;
      else if (typeof value === 'number') ctl = `<input type="number" data-p="${path}" value="${value}" step="any">`;
      else if (/^#[0-9a-f]{6}$/i.test(value)) ctl = `<input type="color" data-p="${path}" value="${value}">`;
      else if (ch) ctl = `<select data-p="${path}">${[...new Set([value, ...ch])].map(c => `<option ${c === value ? 'selected' : ''}>${c}</option>`).join('')}</select>`;
      else ctl = `<input type="text" data-p="${path}" value="${String(value).replace(/"/g, '&quot;')}">`;
      h += `<div class="opt"><span title="${path}">${name}</span>${ctl}</div>`;
    }
  }
  $('opts').innerHTML = h || '<div class="muted">No settings in the code.</div>';
}
// Change a setting -> rewrite the code (as JSON) -> redraw.
$('opts').addEventListener('change', e => {
  const el = e.target.closest('[data-p]'); if (!el) return;
  const v = el.type === 'checkbox' ? el.checked : el.type === 'number' ? +el.value : el.value;
  set(opts, el.dataset.p, v);
  $('code').value = JSON.stringify(opts, null, 2);
  draw();
});
let t = 0;
$('code').addEventListener('input', () => { clearTimeout(t); t = setTimeout(draw, 400); });
$('fmt').onclick = () => { try { $('code').value = JSON.stringify(read($('code').value), null, 2); draw(); } catch (e) { $('msg').textContent = e.message; } };
$('copy').onclick = () => { try { navigator.clipboard.writeText(JSON.stringify(read($('code').value), null, 2)); $('msg').textContent = 'Copied.'; } catch (e) { $('msg').textContent = e.message; } };
addEventListener('resize', () => { clearTimeout(t); t = setTimeout(draw, 200); });

$('code').value = START;
draw();
</script>
</body>
</html>
