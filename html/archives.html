<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Archives</title>
<script src="../js/core/embed.js"></script>
<script src="../js/core/theme.js"></script>
<script src="../js/core/no-autofill.js"></script>
<link rel="stylesheet" href="../css/theme.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo">DN</span><div><h1 id="title">Archives</h1><div class="sub" id="sub"></div></div></div>
    <div class="spacer"></div>
    <input id="note" type="text" placeholder="Note for the snapshot (optional)" style="width:280px">
    <button id="snap">Take snapshot</button>
  </header>
  <div class="main stack">
    <div class="muted">A snapshot copies the project's settings, staged datasets, pipeline and dashboard into archives/. Source files and published output are not included.</div>
    <div class="table-wrap"><table class="grid" id="tbl"></table></div>
    <h2>Compare with current</h2>
    <div id="cmp" class="muted">Click Compare on a snapshot.</div>
    <h2>Activity</h2>
    <div class="log" id="log"></div>
  </div>
</div>

<script src="../js/dn-fs.js"></script>
<script src="../js/core/ui.js"></script>
<script src="../js/core/project-log.js"></script>
<script src="../js/core/projects.js"></script>
<script src="../js/core/module-page.js"></script>
<script>
const { $, esc } = UI;
let ctx;
const PARTS = ['project-config.json', 'data/staged', 'data/source', 'pipeline', 'dashboard']; // what a snapshot holds
const stamp = () => new Date().toISOString().slice(0, 19).replace(/[-:]/g, '').replace('T', '-');

async function snapshots() {
  let dirs = [];
  try { dirs = (await DNFS.list(`${ctx.dir}/archives`)).filter(d => d.dir); } catch {}
  const out = [];
  for (const d of dirs) { try { out.push({ ...(await DNFS.readJSON(`${d.path}/snapshot.json`)), path: d.path }); } catch {} }
  return out.sort((a, b) => b.at.localeCompare(a.at));
}
async function render() {
  const list = await snapshots();
  $('tbl').innerHTML = `<thead><tr><th>Taken</th><th>Note</th><th class="num">Datasets</th><th class="num">Size</th><th></th></tr></thead><tbody>` +
    list.map(s => `<tr data-p="${esc(s.path)}"><td>${UI.date(s.at)}</td><td>${esc(s.note || '')}</td><td class="num">${s.datasets.length}</td><td class="num">${UI.bytes(s.bytes)}</td>
      <td><button class="ghost small" data-act="cmp">Compare</button> <button class="small" data-act="restore">Restore</button> <button class="danger small" data-act="del">Delete</button></td></tr>`).join('') + '</tbody>';
  if (!list.length) $('tbl').innerHTML = '<tbody><tr><td class="muted">No snapshots yet.</td></tr></tbody>';
}

async function take(note) {
  await ctx.reload();
  const dir = `${ctx.dir}/archives/${stamp()}`;
  for (const p of PARTS) if ((await DNFS.stat(`${ctx.dir}/${p}`)).exists) await DNFS.copy(`${ctx.dir}/${p}`, `${dir}/${p}`);
  let bytes = 0;
  try { bytes = (await DNFS.list(dir, { recursive: true })).reduce((s, f) => s + (f.dir ? 0 : f.size), 0); } catch {}
  const info = { at: new Date().toISOString(), note, bytes, datasets: (ctx.cfg.datasets || []).map(d => ({ name: d.name, rows: d.rows, columns: d.columns.length })) };
  await DNFS.writeJSON(`${dir}/snapshot.json`, info);
  await Projects.touchModule(ctx.folder, 'archives');
  ctx.log(`Snapshot taken: ${dir.split('/').pop()}${note ? ` (${note})` : ''}, ${UI.bytes(bytes)}`, 'ok');
  return dir;
}
$('snap').onclick = UI.guard(async () => { $('snap').disabled = true; try { await take($('note').value.trim()); $('note').value = ''; UI.toast('Snapshot taken', 'ok'); await render(); } finally { $('snap').disabled = false; } });

// Current state vs a snapshot: datasets (rows, columns), pipeline steps, dashboard widgets.
async function compare(path) {
  const cur = await ctx.reload(), old = await DNFS.readJSON(`${path}/project-config.json`);
  const read = async p => { try { return await DNFS.readJSON(p); } catch { return null; } };
  const [pn, po, dn, dO] = await Promise.all([read(`${ctx.dir}/pipeline/pipeline.json`), read(`${path}/pipeline/pipeline.json`), read(`${ctx.dir}/dashboard/dashboard.json`), read(`${path}/dashboard/dashboard.json`)]);
  const names = [...new Set([...(old.datasets || []), ...(cur.datasets || [])].map(d => d.name))];
  const by = (l, n) => (l || []).find(d => d.name === n);
  const row = n => {
    const a = by(old.datasets, n), b = by(cur.datasets, n);
    const st = !a ? '<span class="ok">new</span>' : !b ? '<span class="err">removed</span>' : a.rows !== b.rows || a.columns.length !== b.columns.length ? '<span class="warn">changed</span>' : '<span class="muted">same</span>';
    return `<tr><td>${esc(n)}</td><td class="num">${a ? UI.num(a.rows) : '-'}</td><td class="num">${b ? UI.num(b.rows) : '-'}</td><td class="num">${a ? a.columns.length : '-'}</td><td class="num">${b ? b.columns.length : '-'}</td><td>${st}</td></tr>`;
  };
  $('cmp').innerHTML = `<div class="table-wrap"><table class="grid"><thead><tr><th>Dataset</th><th class="num">Rows then</th><th class="num">Rows now</th><th class="num">Columns then</th><th class="num">Columns now</th><th></th></tr></thead><tbody>${names.map(row).join('')}</tbody></table></div>
    <div style="margin-top:8px">Transform queries: ${(po?.queries || po?.steps || []).length} then, ${(pn?.queries || pn?.steps || []).length} now · Dashboard widgets: ${dO?.widgets?.length ?? 0} then, ${dn?.widgets?.length ?? 0} now · Status then: ${esc(old.status)}, now: ${esc(cur.status)}</div>`;
}

// Restore: snapshot the current state first, then copy the snapshot back. Name and folder stay as they are now.
async function restore(path) {
  if (!await UI.confirm('Restore this snapshot? Staged datasets, pipeline and dashboard are replaced. The current state is saved as a new snapshot first.', { danger: true, ok: 'Restore' })) return;
  await take(`Before restoring ${path.split('/').pop()}`);
  for (const p of PARTS.filter(p => p !== 'project-config.json')) {
    if ((await DNFS.stat(`${ctx.dir}/${p}`)).exists) await DNFS.remove(`${ctx.dir}/${p}`, { recursive: true });
    if ((await DNFS.stat(`${path}/${p}`)).exists) await DNFS.copy(`${path}/${p}`, `${ctx.dir}/${p}`); else await DNFS.mkdir(`${ctx.dir}/${p}`);
  }
  const old = await DNFS.readJSON(`${path}/project-config.json`), cur = await ctx.reload();
  await Projects.save({ ...old, name: cur.name, folder: cur.folder, id: cur.id, created: cur.created });
  ctx.log(`Restored snapshot ${path.split('/').pop()}`, 'ok'); UI.toast('Snapshot restored', 'ok');
}

$('tbl').onclick = UI.guard(async ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const path = b.closest('tr').dataset.p;
  if (b.dataset.act === 'cmp') return compare(path);
  if (b.dataset.act === 'restore') { await restore(path); return render(); }
  if (!await UI.confirm(`Delete snapshot ${path.split('/').pop()}? This cannot be undone.`, { danger: true, ok: 'Delete' })) return;
  await DNFS.remove(path, { recursive: true }); ctx.log(`Deleted snapshot ${path.split('/').pop()}`); render();
});

(async () => {
  try { ctx = await ModulePage.init('archives', 'Archives'); await render(); }
  catch (e) { UI.toast(e.message, 'err'); }
})();
</script>
</body>
</html>
