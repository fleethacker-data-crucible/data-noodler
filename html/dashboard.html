<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<script src="../js/core/embed.js"></script>
<script src="../js/core/theme.js"></script>
<link rel="stylesheet" href="../css/theme.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  .addwrap { position: relative; }
  .addmenu { position: absolute; left: 0; top: calc(100% + 4px); z-index: 30; background: var(--panel); border: 1px solid var(--border); border-radius: 4px; box-shadow: 0 6px 18px rgba(0, 0, 0, .35); padding: 4px; display: none; min-width: 150px; }
  .addmenu.open { display: block; }
  .addmenu div { padding: 5px 10px; border-radius: 4px; cursor: pointer; }
  .addmenu div:hover { background: var(--sel); }
  .addmenu small { color: var(--muted); display: block; font-size: 11.5px; }

  /* Canvas: fills the window under the toolbar; grid lines every --g px. Widgets snap to it. */
  .canvas-wrap { flex: 1; min-height: 0; overflow: auto; margin: 14px 20px 20px; border: 1px solid var(--border); border-radius: 4px; }
  .canvas { position: relative; min-height: 100%; min-width: 100%;
    background-image: linear-gradient(to right, color-mix(in srgb, var(--border) 45%, transparent) 1px, transparent 1px),
                      linear-gradient(to bottom, color-mix(in srgb, var(--border) 45%, transparent) 1px, transparent 1px);
    background-size: var(--g) var(--g); }
  .canvas .hint { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }

  .wd { position: absolute; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .wd.sel { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
  .wd.moving { opacity: .85; z-index: 20; box-shadow: 0 8px 24px rgba(0, 0, 0, .35); }
  .wd .wh { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: move; user-select: none; border-bottom: 1px solid var(--border); }
  .wd .wh b { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wd .wh small { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .wd .wb { flex: 1; min-height: 0; overflow: auto; padding: 6px 8px; cursor: pointer; }
  .wd .wb .table-wrap { max-height: none; }
  .wd .note { height: 100%; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 10px; }
  /* Resize handles on every edge and corner (data-dir = n s e w ne nw se sw). */
  .wd .rz { position: absolute; z-index: 3; }
  .wd .rz[data-dir="n"], .wd .rz[data-dir="s"] { left: 8px; right: 8px; height: 6px; cursor: ns-resize; }
  .wd .rz[data-dir="e"], .wd .rz[data-dir="w"] { top: 8px; bottom: 8px; width: 6px; cursor: ew-resize; }
  .wd .rz[data-dir="n"] { top: 0; } .wd .rz[data-dir="s"] { bottom: 0; } .wd .rz[data-dir="w"] { left: 0; } .wd .rz[data-dir="e"] { right: 0; }
  .wd .rz[data-dir$="e"]:not([data-dir="e"]), .wd .rz[data-dir$="w"]:not([data-dir="w"]) { width: 12px; height: 12px; }
  .wd .rz[data-dir="ne"] { top: 0; right: 0; cursor: nesw-resize; } .wd .rz[data-dir="nw"] { top: 0; left: 0; cursor: nwse-resize; }
  .wd .rz[data-dir="se"] { bottom: 0; right: 0; cursor: nwse-resize; } .wd .rz[data-dir="sw"] { bottom: 0; left: 0; cursor: nesw-resize; }
  .wd:hover .rz[data-dir="se"] { background: linear-gradient(135deg, transparent 50%, var(--muted) 50%, var(--muted) 60%, transparent 60%, transparent 72%, var(--muted) 72%, var(--muted) 82%, transparent 82%); }
  /* Charts always fit their widget: the SVG scales to the box, never scrolls. */
  .wd .wb:has(> svg) { overflow: hidden; }
  .wd .wb > svg { width: 100%; height: 100%; display: block; }
  .ghostbox { position: absolute; border: 1px dashed var(--blue); border-radius: 4px; background: color-mix(in srgb, var(--blue) 10%, transparent); pointer-events: none; z-index: 5; }

  .flist { border: 1px solid var(--border); border-radius: 4px; background: var(--bg); max-height: 360px; overflow: auto; }
  .flist div { display: flex; align-items: center; gap: 8px; padding: 4px 8px; cursor: grab; }
  .flist div + div { border-top: 1px solid var(--border); }
  .flist div.drag { opacity: .4; }
  .flist div.over { box-shadow: inset 0 2px 0 var(--blue); }
  .flist .grip { color: var(--muted); letter-spacing: -2px; }
  .flist .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .flist small { color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo">DN</span><div><h1 id="title">Dashboard</h1><div class="sub" id="sub"></div></div></div>
    <div class="row">
      <div class="addwrap"><button id="add" class="go">Add widget ▾</button>
        <div class="addmenu" id="addmenu"></div>
      </div>
      <button id="refresh" class="ghost" title="Re-run every widget (ignores the cache)">Refresh all</button>
    </div>
    <div class="spacer"></div>
  </header>
  <div class="canvas-wrap" id="wrap"><div class="canvas" id="canvas"></div></div>
</div>

<aside class="side" id="side">
  <header><b id="sTitle">Widget</b><button class="x" id="sClose" title="Close (Esc)">✕</button></header>
  <div class="sb" id="sBody"></div>
  <footer><button class="danger" id="sDel">Delete widget</button><button class="ghost" id="sDone">Done</button></footer>
</aside>

<script src="../js/dn-fs.js"></script>
<script src="../js/core/engine-client.js"></script>
<script src="../js/core/ui.js"></script>
<script src="../js/core/project-log.js"></script>
<script src="../js/core/projects.js"></script>
<script src="../js/core/module-page.js"></script>
<script src="../js/dashboard/widgets.js"></script>
<script src="../js/vendor/vega.min.js"></script>
<script src="../js/vendor/vega-lite.min.js"></script>
<script src="../js/widgets/color-picker.js"></script>
<script src="../js/widgets/vega-widget.js"></script>
<script src="../js/widgets/widget-settings.js"></script>
<script>
// Dashboard canvas. State: <project>/dashboard/dashboard.json (v2) = { version: 2, grid, widgets: [...] }
// (widget shape: js/dashboard/widgets.js). Positions/sizes are in grid cells; drag the header to move,
// the corner to resize (both snap to the grid). Click a widget to open its settings on the right.
const { $, esc } = UI, W = Widgets;
const G = 20;                                   // grid cell, px
const SIZE = { chart: [24, 14], table: [30, 14] }, MIN = [8, 5];
let ctx, dash = { version: 2, grid: G, widgets: [] }, selId = null;
const results = new Map();                      // id -> last result (redraw on resize without re-querying)
// Widget packages (global widgets/ folder): built-ins (chart, table) and Vega / Vega-Lite packages (type 'widget').
let pkgs = new Map();
const pkgOf = w => w.type === 'widget' ? pkgs.get(w.pkg) : null;
const isReady = w => { if (w.type !== 'widget') return W.ready(w); const m = pkgOf(w); return !!m && VegaWidget.ready(m, w); };
const queryOf = w => { if (w.type !== 'widget') return W.query(w); const m = pkgOf(w); if (!m) throw new Error(`Widget package "${w.pkg}" not found in widgets/.`); return VegaWidget.query(m, w); };
function paint(el, w, r) {
  if (w.type !== 'widget') return W.render(el, w, r);
  const m = pkgOf(w);
  return VegaWidget.render(el, m, m.specJson, w, r.objs ||= VegaWidget.objects(r)).catch(e => { el.innerHTML = `<div class="note err">${esc(String(e.message || e).split('\n')[0])}</div>`; });
}
const FILE = () => `${ctx.dir}/dashboard/dashboard.json`;
const cachePath = w => `${ctx.dir}/data/cache/widget-${w.id}.json`;
const dsOf = name => (ctx.cfg.datasets || []).find(d => d.name === name);
const readyDs = () => (ctx.cfg.datasets || []).filter(d => Projects.stageOf(d) === 'source');   // data/source only
const byId = id => dash.widgets.find(w => w.id === id);
const saveNow = async () => { dash.updated = new Date().toISOString(); await DNFS.writeJSON(FILE(), dash); };
const save = UI.debounce(() => saveNow().catch(e => UI.toast(`Could not save the dashboard: ${e.message}`, 'err')), 400);

// Older dashboards (v1: a list of cards) become grid widgets: bar/line -> chart, table -> table; KPIs are dropped.
function migrate(d) {
  if (d.version === 2) return d;
  let y = 0;
  const widgets = (d.widgets || []).filter(w => w.type !== 'kpi').map(w => {
    const t = w.type === 'table' ? 'table' : 'chart', [cw, ch] = SIZE[t];
    const n = { id: w.id, type: t, title: w.title || '', dataset: w.dataset, x: 0, y, w: cw, h: ch };
    y += ch + 1;
    if (t === 'chart') Object.assign(n, { chart: w.type, measure: { agg: w.agg || 'count', col: w.col || '' }, category: { col: w.dim || '', sort: w.sort === 'label' ? 'label' : 'value', limit: +w.limit || 20 } });
    else Object.assign(n, { fields: null, limit: +w.limit || 100 });
    return n;
  });
  return { version: 2, grid: G, widgets };
}

// ---- queries (one at a time; the engine itself runs each query on all its workers) ----
// Cache key = dataset version + the widget's declarative query: a new dataset version makes the cache stale.
const keyOf = w => { const d = dsOf(w.dataset); return JSON.stringify({ q: queryOf(w), pv: pkgOf(w)?.version, v: d?.version ?? null, imported: d?.imported }); };
async function compute(w, fresh) {
  const d = dsOf(w.dataset); if (!d) throw new Error(`Dataset "${w.dataset}" not found.`);
  if (!fresh) { try { const c = await DNFS.readJSONOr(cachePath(w), {}); if (c.key === keyOf(w)) return { ...c.res, cached: true }; } catch {} }
  const t0 = performance.now();
  const res = await Engine.call('query', { query: queryOf(w), views: Engine.views([d]) });
  const out = { cols: res.cols, rows: res.rows, ms: performance.now() - t0, engineMs: res.ms };
  DNFS.writeJSON(cachePath(w), { key: keyOf(w), at: new Date().toISOString(), res: out }).catch(() => {});
  return out;
}
let queue = Promise.resolve();
function draw(w, fresh = false) {
  queue = queue.then(async () => {
    const el = document.querySelector(`.wd[data-id="${w.id}"]`); if (!el) return;
    const body = el.querySelector('.wb'), meta = el.querySelector('.wh small');
    results.delete(w.id);
    if (w.type === 'widget' && !pkgOf(w)) { meta.textContent = ''; body.innerHTML = `<div class="note err">Widget package "${esc(w.pkg)}" not found in widgets/.</div>`; return; }
    if (!isReady(w)) {
      meta.textContent = '';
      body.innerHTML = `<div class="note">${!w.dataset ? 'Click to choose a dataset' : w.type === 'table' ? 'Click to pick fields' : w.type === 'widget' ? 'Click to connect the data inputs' : 'Click to set the X and Y axis'}</div>`;
      return;
    }
    body.innerHTML = '<div class="note">Loading…</div>';
    try {
      const r = await compute(w, fresh);
      results.set(w.id, r);
      await paint(body, w, r);
      meta.textContent = r.cached ? 'cached' : UI.ms(r.ms);
    } catch (e) { body.innerHTML = `<div class="note err">${esc(e.message.split('\n')[0])}</div>`; meta.textContent = ''; }
  });
  return queue;
}
const titleOf = w => w.title || (w.type === 'widget' ? pkgOf(w)?.name || w.pkg : w.type === 'table' ? 'Table' : w.category?.col ? `${W.AGG_LABEL[w.measure.agg]}${w.measure.col ? ` of ${w.measure.col}` : ''} by ${w.category.col}` : 'Chart');

// ---- canvas ----
function place(el, w) {
  Object.assign(el.style, { left: `${w.x * G}px`, top: `${w.y * G}px`, width: `${w.w * G - 1}px`, height: `${w.h * G - 1}px` });
}
function widgetEl(w) {
  const el = document.createElement('div');
  el.className = 'wd' + (w.id === selId ? ' sel' : ''); el.dataset.id = w.id;
  el.innerHTML = `<div class="wh"><b></b><small></small></div><div class="wb"></div>${["n", "s", "e", "w", "ne", "nw", "se", "sw"].map(d => `<div class="rz" data-dir="${d}"></div>`).join("")}`;
  el.querySelector('b').textContent = titleOf(w);
  place(el, w);
  return el;
}
function fitCanvas() {   // grow the canvas below/right of the lowest/rightmost widget, so there is room to drag into
  const c = $('canvas'), maxY = Math.max(0, ...dash.widgets.map(w => w.y + w.h)), maxX = Math.max(0, ...dash.widgets.map(w => w.x + w.w));
  c.style.height = `${(maxY + 10) * G}px`; c.style.width = `${(maxX + 2) * G}px`;
  c.querySelector('.hint')?.remove();
  if (!dash.widgets.length) c.insertAdjacentHTML('beforeend', '<div class="hint">Empty dashboard. Use Add widget to place a chart or table.</div>');
}
function renderAll(fresh = false) {
  const c = $('canvas');
  c.querySelectorAll('.wd').forEach(e => e.remove());
  for (const w of dash.widgets) c.append(widgetEl(w));
  fitCanvas();
  for (const w of dash.widgets) draw(w, fresh);
}
const cols = () => Math.max(MIN[0], Math.floor($('wrap').clientWidth / G));

// Move / resize with the pointer; both snap to the grid. A press without movement = click (opens settings).
$('canvas').addEventListener('pointerdown', ev => {
  const el = ev.target.closest('.wd'); if (!el || ev.button !== 0) return;
  const w = byId(el.dataset.id), mode = ev.target.closest('.rz') ? 'size:' + ev.target.closest('.rz').dataset.dir : ev.target.closest('.wh') ? 'move' : null;
  if (!mode) return;   // body: plain click
  ev.preventDefault();
  const sx = ev.clientX, sy = ev.clientY, start = { ...w };
  const ghost = Object.assign(document.createElement('div'), { className: 'ghostbox' });
  let moved = false;
  const onMove = e => {
    const dx = Math.round((e.clientX - sx) / G), dy = Math.round((e.clientY - sy) / G);
    if (!moved && Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) < 4) return;
    if (!moved) { moved = true; el.classList.add('moving'); $('canvas').append(ghost); }
    if (mode === 'move') {
      w.x = Math.max(0, Math.min(cols() - w.w, start.x + dx)); w.y = Math.max(0, start.y + dy);
      place(ghost, w); Object.assign(el.style, { left: `${start.x * G + e.clientX - sx}px`, top: `${start.y * G + e.clientY - sy}px` });
    } else {
      // Edges: the dragged side moves, the opposite side stays put (in grid cells).
      const dir = mode.slice(5), right = start.x + start.w, bottom = start.y + start.h;
      let x = start.x, y = start.y, x2 = right, y2 = bottom;
      if (dir.includes('e')) x2 = Math.max(start.x + MIN[0], Math.min(cols(), right + dx));
      if (dir.includes('w')) x = Math.max(0, Math.min(right - MIN[0], start.x + dx));
      if (dir.includes('s')) y2 = Math.max(start.y + MIN[1], bottom + dy);
      if (dir.includes('n')) y = Math.max(0, Math.min(bottom - MIN[1], start.y + dy));
      Object.assign(w, { x, y, w: x2 - x, h: y2 - y });
      place(ghost, w); place(el, w);   // the widget follows the snapped box
      const r = results.get(w.id); if (r) liveRedraw(el.querySelector('.wb'), w, r);   // charts redraw live to the new size
    }
  };
  const onUp = () => {
    removeEventListener('pointermove', onMove); removeEventListener('pointerup', onUp);
    ghost.remove(); el.classList.remove('moving'); place(el, w);
    if (!moved) return select(w.id);
    fitCanvas(); save();
    if (mode !== 'move') { const r = results.get(w.id); if (r) paint(el.querySelector('.wb'), w, r); }
  };
  addEventListener('pointermove', onMove); addEventListener('pointerup', onUp);
});
// Vega charts are heavier to redraw: at most once per frame while dragging.
let lrFrame = 0, lrArgs;
function liveRedraw(el, w, r) { if (w.type !== 'widget') return W.render(el, w, r); lrArgs = [el, w, r]; if (!lrFrame) lrFrame = requestAnimationFrame(() => { lrFrame = 0; paint(...lrArgs); }); }
$('canvas').addEventListener('click', ev => {
  const el = ev.target.closest('.wd');
  if (!el) return select(null);
  if (ev.target.closest('.wb')) select(el.dataset.id);
});

// ---- add ----
$('add').onclick = ev => { ev.stopPropagation(); $('addmenu').classList.toggle('open'); };
addEventListener('click', () => $('addmenu').classList.remove('open'));
$('addmenu').onclick = UI.guard(async ev => {
  const pid = ev.target.closest('[data-pkg]')?.dataset.pkg; if (!pid) return;
  $('addmenu').classList.remove('open');
  const m = pkgs.get(pid), t = m.kind === 'builtin' ? m.builtin : 'widget';
  const [cw, ch] = SIZE[t] || SIZE.chart, ds = readyDs();
  const w = { id: crypto.randomUUID().slice(0, 8), type: t, title: '', dataset: ds.length === 1 ? ds[0].name : '',
    x: 0, y: Math.max(0, ...dash.widgets.map(o => o.y + o.h + 1)), w: Math.min(cw, cols()), h: ch };
  if (t === 'chart') Object.assign(w, { chart: 'bar', measure: { agg: 'count', col: '' }, category: { col: '', sort: 'value', limit: 20 } });
  else if (t === 'table') Object.assign(w, { fields: [], limit: 100 });
  else Object.assign(w, { pkg: m.id, inputs: {}, opts: {}, limit: 5000 });
  dash.widgets.push(w); await saveNow();
  $('canvas').append(widgetEl(w)); fitCanvas(); draw(w);
  select(w.id);
  document.querySelector(`.wd[data-id="${w.id}"]`).scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  ctx.log(`Widget added: ${m.name}`);
});
$('refresh').onclick = UI.guard(async () => { await ctx.reload(); renderAll(true); await Projects.touchModule(ctx.folder, 'dashboard'); });

// ---- settings popout ----
function select(id) {
  selId = id;
  document.querySelectorAll('.wd').forEach(e => e.classList.toggle('sel', e.dataset.id === id));
  if (!id) return $('side').classList.remove('open');
  panel(byId(id)); $('side').classList.add('open');
}
// A setting changed: save, update the title, re-run the widget (debounced while typing).
const rerun = UI.debounce(w => draw(w), 350);
function changed(w, query = true) {
  save();
  const el = document.querySelector(`.wd[data-id="${w.id}"]`); if (el) el.querySelector('b').textContent = titleOf(w);
  if (query) rerun(w);
}
const opt = (v, label, cur) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(label)}</option>`;
const colOpts = (w, cur, { numeric = false, blank = '' } = {}) => (blank ? opt('', blank, cur) : opt('', 'Select a field…', cur)) +
  (dsOf(w.dataset)?.columns || []).filter(c => !numeric || W.NUMERIC.test(c.type)).map(c => opt(c.name, c.name, cur)).join('');

function panel(w) {
  $('sTitle').textContent = w.type === 'widget' ? pkgOf(w)?.name || w.pkg : w.type === 'table' ? 'Table' : 'Chart';
  const ds = readyDs(), list = ds.some(d => d.name === w.dataset) || !w.dataset ? ds : [...ds, dsOf(w.dataset) || { name: w.dataset }];
  let h = `<label class="field">Title<input id="pTitle" type="text" value="${esc(w.title)}" placeholder="${esc(titleOf({ ...w, title: '' }))}"></label>
    <label class="field">Dataset<select id="pDs">${opt('', 'Select a dataset…', w.dataset)}${list.map(d => opt(d.name, d.name, w.dataset)).join('')}</select></label>`;
  if (!ds.length) h += `<div class="muted">No ready datasets. Use Import Directly, or run the Pipeline on staged data.</div>`;
  if (w.type === 'widget') {
    $('sBody').innerHTML = h + '<div id="wsBody" style="display:flex;flex-direction:column;gap:12px"></div>';
    bindPanel(w);
    const m = pkgOf(w); if (!m) return;
    const look = () => { const r = results.get(w.id), el = document.querySelector(`.wd[data-id="${w.id}"] .wb`); if (r && el) liveRedraw(el, w, r); };
    WidgetSettings.render($('wsBody'), { manifest: m, w, columns: dsOf(w.dataset)?.columns || [],
      onChange: (kind, live) => { if (kind === 'look') { look(); if (!live) save(); } else changed(w); } });
    return;
  } else if (w.type === 'chart') {
    const m = w.measure, c = w.category, numeric = m.agg === 'sum' || m.agg === 'avg';
    const measure = `<label class="field">Aggregation<select id="pAgg">${W.AGGS.map(a => opt(a, W.AGG_LABEL[a], m.agg)).join('')}</select></label>
      <label class="field">Field<select id="pCol">${colOpts(w, m.col, { numeric, blank: m.agg === 'count' ? 'All rows' : '' })}</select></label>`;
    const category = `<label class="field">Field<select id="pDim">${colOpts(w, c.col)}</select></label>
      ${w.chart === 'bar' ? `<label class="field">Order<select id="pSort">${opt('value', 'Largest first', c.sort)}${opt('label', 'A to Z', c.sort)}</select></label>` : ''}
      <label class="field">Max ${w.chart === 'bar' ? 'bars' : 'points'}<input id="pLimit" type="number" min="1" max="1000" value="${+c.limit || 20}"></label>`;
    h += `<div class="field"><span>Chart type</span><div class="seg" id="pChart">${Object.entries(W.CHARTS).map(([k, l]) => `<button data-v="${k}" class="${w.chart === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
      <h2>X axis <small class="muted" style="text-transform:none;letter-spacing:0">${w.chart === 'bar' ? 'value' : 'categories'}</small></h2>${w.chart === 'bar' ? measure : category}
      <h2>Y axis <small class="muted" style="text-transform:none;letter-spacing:0">${w.chart === 'bar' ? 'categories' : 'value'}</small></h2>${w.chart === 'bar' ? category : measure}`;
  } else {
    const all = (dsOf(w.dataset)?.columns || []), on = w.fields || [];
    const ordered = [...on.map(n => all.find(c => c.name === n)).filter(Boolean), ...all.filter(c => !on.includes(c.name))];
    h += `<h2>Fields <small class="muted" style="text-transform:none;letter-spacing:0">tick to show, drag to order</small></h2>
      ${all.length ? `<div class="row"><button class="ghost small" id="pAll">All</button><button class="ghost small" id="pNone">None</button></div>
      <div class="flist" id="pFields">${ordered.map(c => `<div draggable="true" data-n="${esc(c.name)}"><span class="grip">⋮⋮</span><input type="checkbox" ${on.includes(c.name) ? 'checked' : ''}><span class="nm">${esc(c.name)}</span><small>${esc(c.type)}</small></div>`).join('')}</div>` : '<div class="muted">Choose a dataset first.</div>'}
      <label class="field">Max rows<input id="pLimit" type="number" min="1" max="1000" value="${+w.limit || 100}"></label>`;
  }
  $('sBody').innerHTML = h;
  bindPanel(w);
}

function bindPanel(w) {
  const on = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn); };
  on('pTitle', 'input', e => { w.title = e.target.value; changed(w, false); });
  on('pDs', 'change', e => {
    w.dataset = e.target.value;
    if (w.type === 'chart') { w.measure.col = ''; w.category.col = ''; } else if (w.type === 'widget') w.inputs = {}; else w.fields = [];
    changed(w); panel(w);
  });
  if (w.type === 'widget') return;
  if (w.type === 'chart') {
    $('pChart').onclick = e => { const v = e.target.closest('[data-v]')?.dataset.v; if (!v || v === w.chart) return; w.chart = v; changed(w); panel(w); };
    on('pAgg', 'change', e => {
      w.measure.agg = e.target.value;
      const col = (dsOf(w.dataset)?.columns || []).find(c => c.name === w.measure.col);
      if ((w.measure.agg === 'sum' || w.measure.agg === 'avg') && col && !W.NUMERIC.test(col.type)) w.measure.col = '';
      changed(w); panel(w);
    });
    on('pCol', 'change', e => { w.measure.col = e.target.value; changed(w); });
    on('pDim', 'change', e => { w.category.col = e.target.value; changed(w); });
    on('pSort', 'change', e => { w.category.sort = e.target.value; changed(w); });
    on('pLimit', 'input', e => { w.category.limit = Math.max(1, Math.min(1000, +e.target.value || 20)); changed(w); });
  } else {
    const list = $('pFields');
    const sync = () => { w.fields = [...list.children].filter(r => r.querySelector('input').checked).map(r => r.dataset.n); changed(w); };
    on('pLimit', 'input', e => { w.limit = Math.max(1, Math.min(1000, +e.target.value || 100)); changed(w); });
    if (!list) return;
    list.addEventListener('change', sync);
    $('pAll').onclick = () => { list.querySelectorAll('input').forEach(i => i.checked = true); sync(); };
    $('pNone').onclick = () => { list.querySelectorAll('input').forEach(i => i.checked = false); sync(); };
    // Drag to reorder (drop above the row under the pointer).
    let dragging = null;
    list.addEventListener('dragstart', e => { dragging = e.target.closest('[data-n]'); dragging.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; });
    list.addEventListener('dragover', e => {
      e.preventDefault();
      const over = e.target.closest('[data-n]');
      list.querySelectorAll('.over').forEach(r => r.classList.remove('over'));
      if (over && over !== dragging) over.classList.add('over');
    });
    list.addEventListener('drop', e => {
      e.preventDefault();
      const over = e.target.closest('[data-n]');
      if (over && dragging && over !== dragging) list.insertBefore(dragging, over);
      else if (!over && dragging) list.append(dragging);
    });
    list.addEventListener('dragend', () => { dragging?.classList.remove('drag'); list.querySelectorAll('.over').forEach(r => r.classList.remove('over')); dragging = null; sync(); });
  }
}
$('sClose').onclick = $('sDone').onclick = () => select(null);
addEventListener('keydown', e => { if (e.key === 'Escape' && !document.querySelector('dialog[open]')) select(null); });
$('sDel').onclick = UI.guard(async () => {
  const w = byId(selId); if (!w) return;
  if (!await UI.confirm(`Delete "${titleOf(w)}"?`, { danger: true, ok: 'Delete' })) return;
  dash.widgets = dash.widgets.filter(x => x !== w); results.delete(w.id);
  document.querySelector(`.wd[data-id="${w.id}"]`)?.remove();
  select(null); fitCanvas(); await saveNow(); DNFS.remove(cachePath(w)).catch(() => {});
  ctx.log(`Widget deleted: ${titleOf(w)}`);
});

// Add widget list = every folder in widgets/ with a valid widget.json.
async function loadPkgs() {
  const list = await WidgetRegistry.list(true);
  pkgs = new Map(list.map(m => [m.id, m]));
  $('addmenu').innerHTML = list.map(m => `<div data-pkg="${esc(m.id)}">${esc(m.name)}<small>${esc(m.description || (m.kind === 'builtin' ? '' : m.kind))}</small></div>`).join('') || '<div class="muted">No widgets in the widgets folder.</div>';
}
$('add').addEventListener('click', () => loadPkgs().catch(() => {}));   // pick up packages saved in the Widget Builder meanwhile
// Window resized: redraw charts at their new pixel size (from the last result, no re-query).
addEventListener('resize', UI.debounce(() => dash.widgets.forEach(w => { const r = results.get(w.id), el = document.querySelector(`.wd[data-id="${w.id}"] .wb`); if (r && el) paint(el, w, r); }), 200));

(async () => {
  try {
    document.documentElement.style.setProperty('--g', `${G}px`);
    ctx = await ModulePage.init('dashboard', 'Dashboard');
    await loadPkgs();
    const raw = await DNFS.readJSONOr(FILE(), null);
    dash = raw ? migrate(raw) : { version: 2, grid: G, widgets: [] };
    if (raw && raw.version !== 2) { await saveNow(); ctx.log('Dashboard converted to the grid layout.'); }
    renderAll();
  } catch (e) { UI.toast(e.message, 'err'); $('canvas').innerHTML = `<div class="hint err">${esc(e.message)}</div>`; }
})();
</script>
