<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Data Noodler</title>
    <script>
      // Size and center the app window
      const W = 1500;
      const H = 1000;
      window.resizeTo(W, H);
      window.moveTo(
        screen.availLeft + (screen.availWidth - W) / 2,
        screen.availTop + (screen.availHeight - H) / 2
      );
    </script>
    <style>
      body {
        font: 15px system-ui;
        margin: 0;
        display: grid;
        place-items: center;
        height: 100vh;
        background: #f4f6f8;
      }

      .card {
        background: #fff;
        padding: 24px 32px;
        border-radius: 10px;
        box-shadow: 0 2px 10px #0002;
        min-width: 380px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 20px;
      }

      td {
        padding: 3px 12px 3px 0;
      }

      td:first-child {
        color: #666;
      }

      button {
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Window test</h1>
      <table id="info"></table>
      <button onclick="location.reload()">Re-center</button>
    </div>

    <script>
      function show() {
        const rows = {
          'Window size': `${outerWidth} × ${outerHeight}`,
          'Window position': `${screenX}, ${screenY}`,
          'Screen (available)': `${screen.availWidth} × ${screen.availHeight}`,
          'Display scaling': `${Math.round(devicePixelRatio * 100)}%`,
          'Protocol': location.protocol
        };

        document.getElementById('info').innerHTML = Object.entries(rows)
          .map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`)
          .join('');
      }

      show();
      setInterval(show, 500);
    </script>
  </body>
</html>
