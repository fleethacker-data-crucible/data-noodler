<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data Grid</title>
<script src="../js/core/theme.js"></script>
<script src="../js/core/no-autofill.js"></script>
<link rel="stylesheet" href="../css/theme.css">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); }
  * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }
  .pop { display: flex; flex-direction: column; height: 100%; padding: 12px 16px; box-sizing: border-box; gap: 6px; }
  .pop h2 { margin: 0; font-size: 15px; flex: none; }
  #body { flex: 1; min-height: 0; }
  .note { height: 100%; display: grid; place-items: center; color: var(--muted); }
</style>
</head>
<body>
<div class="pop"><h2 id="h"></h2><div id="body"><div class="note">Loading…</div></div></div>
<script src="../js/dn-fs.js"></script>
<script src="../js/core/engine-client.js"></script>
<script src="../js/core/ui.js"></script>
<script src="../js/charts/apex-render.js"></script>
<script src="../js/charts/apex-options.js"></script>
<script src="../js/charts/apex-widget.js"></script>
<script src="../js/grid/data-grid-pkg.js"></script>
<script>
// Pop-out of any Data Grid (its Pop-out button, js/charts/apex-render.js). ?id=<key in opener.DNGridPops>: the spec, rows
// (local grids) or the engine pager (remote grids) and the columns. Drawn here with this window's own grid scripts.
// window.DNGridShow(d) draws new data in this same window (Transform: Preview Output / Preview Source while popped out).
let inst = null;
async function draw(d) {
  const body = document.getElementById('body');
  try {
    if (!d) throw new Error('Open this window with a Data Grid\'s Pop-out button.');
    ApexRender.dispose(inst);
    document.title = `${d.title} · Data Grid`; document.getElementById('h').textContent = d.title;
    const s = JSON.parse(JSON.stringify(d.s)), rows = JSON.parse(JSON.stringify(d.rows || [])), names = [...d.names], columns = JSON.parse(JSON.stringify(d.columns || []));
    // The same grid and style sheet (js/grid/data-grid.css) as where it was popped out from.
    const m = await DataGrid.pkg();
    body.innerHTML = '<div style="width:100%;height:100%;overflow:hidden"></div>';
    ApexWidget.useStyle(m, body);
    inst = await ApexRender.render('apexgrid', body.firstElementChild, s, [], rows, 0, 0, ApexWidget.theme(body), { live: true, names, columns, remote: d.remote, more: d.more, total: d.total, popped: true, wid: d.wid, renderer: m.renderer });
  } catch (e) { body.innerHTML = `<div class="note err">${UI.esc(String(e.message || e).split('\n')[0])}</div>`; }
}
window.DNGridShow = draw;
draw(window.opener?.DNGridPops?.[new URLSearchParams(location.search).get('id')]);
// Export .parquet / .sqlite (and .csv of engine grids): same as every Data Grid (UI only for now).
document.getElementById('body').addEventListener('grid-export', e => UI.toast(`Export to .${e.detail.format}: not built yet.`));
// Ctrl + wheel outside the grid: no page zoom (the grid handles its own wheel rules).
// Attached only while Ctrl is held, so plain wheel scrolling never waits on the page.
const noZoom = e => { if (e.ctrlKey) e.preventDefault(); };
let zOn = false;
const zMods = e => { const want = !!e.ctrlKey; if (want === zOn) return; zOn = want; want ? addEventListener('wheel', noZoom, { passive: false }) : removeEventListener('wheel', noZoom, { passive: false }); };
addEventListener('keydown', zMods, true); addEventListener('keyup', zMods, true); addEventListener('blur', () => zMods({}));
</script>
</body>
</html>
