<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Update</title>
<link rel="stylesheet" href="../css/theme.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo">DN</span><div><h1 id="title">Update</h1><div class="sub" id="sub"></div></div></div>
    <div class="spacer"></div>
    <button id="check" class="ghost">Check sources</button>
    <button id="go" class="go">Update selected</button>
  </header>
  <div class="main stack">
    <div class="muted">Re-imports datasets whose source files changed (with the same column choices as the first import), then re-runs the pipeline. Copy a new version of a file over the old one in data/source, or upload it with the same name in Import.</div>
    <label class="row"><input type="checkbox" id="rerun" checked> Re-run the pipeline afterwards</label>
    <div class="table-wrap"><table class="grid" id="tbl"></table></div>
    <h2>Changes</h2>
    <div id="changes" class="muted">Run an update to see what changed.</div>
    <h2>Activity</h2>
    <div class="log" id="log"></div>
  </div>
</div>

<script src="../js/dn-fs.js"></script>
<script src="../js/duckdb-engine.js"></script>
<script src="../js/core/ui.js"></script>
<script src="../js/core/project-log.js"></script>
<script src="../js/core/projects.js"></script>
<script src="../js/core/module-page.js"></script>
<script src="../js/import/source-reader.js"></script>
<script src="../js/pipeline/steps.js"></script>
<script src="../js/pipeline/runner.js"></script>
<script>
const { $, esc } = UI, R = SourceReader;
let ctx, E, state = []; // [{ d, stat, status }]

async function check() {
  await ctx.reload();
  state = [];
  for (const d of (ctx.cfg.datasets || []).filter(x => x.source && x.source.kind !== 'pipeline')) {
    const st = await DNFS.stat(d.source.path).catch(() => ({ exists: false }));
    const status = !st.exists ? 'missing' : (d.source.size == null ? 'unknown' : st.size !== d.source.size || st.modified !== d.source.modified ? 'changed' : 'same');
    state.push({ d, st, status });
  }
  $('tbl').innerHTML = `<thead><tr><th></th><th>Dataset</th><th>Source file</th><th>Imported</th><th>Source now</th><th>Status</th></tr></thead><tbody>` +
    state.map((s, i) => `<tr><td><input type="checkbox" data-i="${i}" ${s.status === 'changed' || s.status === 'unknown' ? 'checked' : ''} ${s.status === 'missing' ? 'disabled' : ''}></td>
      <td><b>${esc(s.d.name)}</b><div class="sub">${UI.num(s.d.rows)} rows</div></td><td class="mono">${esc(s.d.source.path.split('/').pop())}${s.d.source.table ? ` : ${esc(s.d.source.table)}` : ''}</td>
      <td>${UI.date(s.d.imported)}</td><td>${s.st.exists ? `${UI.bytes(s.st.size)} · ${UI.date(s.st.modified)}` : '-'}</td>
      <td>${{ same: '<span class="muted">unchanged</span>', changed: '<span class="warn">changed</span>', missing: '<span class="err">missing</span>', unknown: '<span class="muted">unknown (older import)</span>' }[s.status]}</td></tr>`).join('') + '</tbody>';
  if (!state.length) $('tbl').innerHTML = '<tbody><tr><td class="muted">No imported datasets yet.</td></tr></tbody>';
}
$('check').onclick = UI.guard(check);

// Re-import one dataset; returns a description of what changed.
async function reimport(d) {
  const r = await R.open(E, d.source.path), src = await r.sql(d.source.table || '');
  const oldCols = d.columns, w = await E.writeProjectFile(`SELECT ${d.source.select} FROM ${src}`, d.path, 'FORMAT PARQUET, COMPRESSION ZSTD, ROW_GROUP_SIZE 100000');
  const url = E.url(d.path);
  const rows = Number((await E.query(`SELECT count(*) FROM read_parquet('${url}')`)).rows[0][0]);
  const columns = await R.schema(E, `read_parquet('${url}')`);
  const st = await DNFS.stat(d.source.path);
  await Projects.upsertDataset(ctx.folder, { ...d, rows, bytes: w.bytes, columns, imported: new Date().toISOString(), source: { ...d.source, size: st.size, modified: st.modified } });
  const was = new Map(oldCols.map(c => [c.name, c.type])), now = new Map(columns.map(c => [c.name, c.type]));
  return {
    name: d.name, before: d.rows, after: rows,
    added: columns.filter(c => !was.has(c.name)).map(c => c.name),
    removed: oldCols.filter(c => !now.has(c.name)).map(c => c.name),
    retyped: columns.filter(c => was.has(c.name) && was.get(c.name) !== c.type).map(c => `${c.name} ${was.get(c.name)}→${c.type}`),
  };
}
const delta = (a, b) => { const d = b - a; return `${UI.num(a)} → ${UI.num(b)} <span class="${d > 0 ? 'ok' : d < 0 ? 'err' : 'muted'}">(${d >= 0 ? '+' : ''}${UI.num(d)})</span>`; };

$('go').onclick = UI.guard(async () => {
  const picked = [...document.querySelectorAll('#tbl input:checked')].map(c => state[+c.dataset.i]);
  if (!picked.length && !$('rerun').checked) throw new Error('Nothing selected.');
  $('go').disabled = true;
  const out = [];
  try {
    for (const s of picked) {
      ctx.log(`Re-importing ${s.d.name}…`);
      const c = await reimport(s.d); out.push(c);
      ctx.log(`${c.name}: ${UI.num(c.before)} → ${UI.num(c.after)} rows`, 'ok');
    }
    let run = null;
    if ($('rerun').checked) {
      const pipe = await PipelineRunner.load(ctx);
      if (pipe.steps.length) { ctx.log('Re-running the pipeline…'); run = await PipelineRunner.run(E, ctx, pipe, (m, l) => ctx.log(m, l)); }
    }
    await Projects.touchModule(ctx.folder, 'update', { datasets: out.length });
    $('changes').innerHTML = `<div class="table-wrap"><table class="grid"><thead><tr><th>Dataset</th><th>Rows</th><th>Columns added</th><th>Columns removed</th><th>Type changes</th></tr></thead><tbody>` +
      out.map(c => `<tr><td>${esc(c.name)}</td><td>${delta(c.before, c.after)}</td><td>${esc(c.added.join(', ')) || '-'}</td><td>${esc(c.removed.join(', ')) || '-'}</td><td>${esc(c.retyped.join(', ')) || '-'}</td></tr>`).join('') +
      (run ? run.outputs.map(o => `<tr><td>${esc(o.name)} <span class="muted">(pipeline)</span></td><td>${o.before == null ? UI.num(o.rows) : delta(o.before, o.rows)}</td><td colspan="3" class="muted">re-run ${run.ok ? 'ok' : 'failed'}</td></tr>`).join('') : '') +
      `</tbody></table></div>` + (run && !run.ok ? `<div class="err">Pipeline failed: ${esc(run.error)}</div>` : '');
    UI.toast('Update finished', 'ok');
  } finally { $('go').disabled = false; await check(); }
});

(async () => {
  try {
    ctx = await ModulePage.init('update', 'Update');
    E = DuckEngine; await E.init();
    await check();
  } catch (e) { UI.toast(e.message, 'err'); }
})();
</script>
</body>
</html>
