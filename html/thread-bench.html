<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine Benchmark</title>
<style>
  @font-face { font-family: 'Exo 2'; font-weight: 400; src: url(../assets/fonts/exo2-400.ttf) format('truetype'); }
  @font-face { font-family: 'Exo 2'; font-weight: 600; src: url(../assets/fonts/exo2-600.ttf) format('truetype'); }
  :root {
    color-scheme: light;
    --bg: #fcfcfb; --panel: #f4f4f2; --border: #dddcd6;
    --text: #0b0b0b; --text-2: #52514e; --muted: #85837c;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #c9a227; --s5: #9b6bd6; --s6: #d6529a;
    --ok: #0a7a3d; --err: #c42b2b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #1a1a19; --panel: #242422; --border: #3a3936;
      --text: #ffffff; --text-2: #c3c2b7; --muted: #8d8b82;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c9a227; --s5: #9b6bd6; --s6: #d6529a;
      --ok: #4cc27f; --err: #ff7b7b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px 20px; font: 14px 'Exo 2', system-ui, sans-serif; background: var(--bg); color: var(--text); }
  h1 { font-size: 18px; margin: 0 0 12px; }
  h2 { font-size: 14px; margin: 18px 0 6px; color: var(--text-2); font-weight: 600; }
  button, input, select { font: inherit; }
  button { padding: 4px 10px; }
  input[type=number] { width: 52px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-bottom: 8px; }
  .box { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; }
  #env { display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 13px; color: var(--text-2); margin-bottom: 10px; }
  #env b { color: var(--text); font-weight: 600; }
  #bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin: 6px 0; }
  #fill { height: 100%; width: 0; background: var(--s1); transition: width .15s; }
  #msg { font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: var(--text-2); }
  #log { font: 12px ui-monospace, Consolas, monospace; max-height: 120px; overflow: auto; color: var(--muted); white-space: pre-wrap; }
  .err { color: var(--err); } .ok { color: var(--ok); }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; margin-top: 12px; }
  .chart h3 { margin: 0 0 4px; font-size: 13px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  svg { width: 100%; height: auto; display: block; }
  svg text { fill: var(--text-2); font-size: 11px; }
  svg .grid { stroke: var(--border); stroke-width: 1; }
  svg .ref { stroke: var(--text-2); stroke-width: 1; stroke-dasharray: 4 3; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 4px 8px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-2); font-weight: 600; }
  #tbl { overflow-x: auto; }
  #tip { position: fixed; pointer-events: none; background: var(--text); color: var(--bg); padding: 4px 8px; border-radius: 4px; font-size: 12px; display: none; z-index: 9; }
</style>
</head>
<body>
<h1>Worker benchmark: native engine workers on Parquet</h1>

<div id="env">Starting engine…</div>

<div class="row">
  <label>Data <select id="data">
    <option value="test-data/sales_1m">sales_1m (1M rows)</option>
    <option value="test-data/sales_10m">sales_10m (10M rows)</option>
  </select></label>
  <label>Read from <select id="source">
    <option value="file">Parquet (read from disk)</option>
    <option value="table">In-memory table (cached in the engine)</option>
  </select></label>
  <label>Runs <input id="runs" type="number" min="1" max="10" value="3"></label>
  <span>Workers <span id="threads"></span></span>
  <button id="go" disabled>Run benchmark</button>
</div>

<div class="box">
  <div id="msg">Idle.</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="log"></div>
</div>

<div class="charts">
  <div class="box chart"><h3>Query time by worker count (median, lower is better)</h3><div class="legend" id="lg1"></div><div id="c1"></div></div>
  <div class="box chart"><h3>Speedup vs 1 worker (higher is better)</h3><div class="legend" id="lg2"></div><div id="c2"></div></div>
</div>

<h2>Results</h2>
<div id="tbl" class="box">Run the benchmark to fill this in.</div>
<div id="tip"></div>

<script src="../js/dn-fs.js"></script>
<script src="../js/core/engine-client.js"></script>
<script src="../js/test-data-gen.js"></script>
<script>
const $ = id => document.getElementById(id);
const log = (m, c = '') => { const d = document.createElement('div'); d.className = c; d.textContent = m; $('log').append(d); $('log').scrollTop = 1e9; };
const fmtMs = ms => ms >= 1000 ? (ms / 1000).toFixed(2) + ' s' : Math.round(ms) + ' ms';
const med = a => { const b = [...a].sort((x, y) => x - y), h = b.length >> 1; return b.length % 2 ? b[h] : (b[h - 1] + b[h]) / 2; };
const COLORS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)'];
const guard = fn => async () => { try { await fn(); } catch (e) { log('FAILED: ' + e.message, 'err'); console.error(e); } };
// Engine time of one query at n workers (the engine reports its own ms; JSON transfer not included).
const timed = async (sql, n) => (await Engine.query(sql, { workers: n, limit: 10 })).ms;

// Each query reads from SRC (the Parquet file or the engine's in-memory table).
let SRC = '';
const QUERIES = [
  { id: 'scan',   label: 'Scan + sum',  sql: () => `SELECT count(*), sum(total), avg(unit_price), max(order_date) FROM ${SRC}` },
  { id: 'group',  label: 'Group by',    sql: () => `SELECT region, category, count(*), sum(total), avg(discount) FROM ${SRC} GROUP BY ALL` },
  { id: 'dist',   label: 'Distinct',    sql: () => `SELECT count(DISTINCT customer_id), count(DISTINCT (customer_id, category)) FROM ${SRC}` },
  { id: 'sort',   label: 'Full sort',   sql: () => `SELECT max(rn) FROM (SELECT row_number() OVER (ORDER BY total DESC, id) rn FROM ${SRC})` },
  { id: 'join',   label: 'Join',        sql: () => `SELECT count(*), sum(s.total / c.avg_total) FROM ${SRC} s JOIN (SELECT customer_id, avg(total) avg_total FROM ${SRC} GROUP BY 1) c USING (customer_id)` },
  { id: 'window', label: 'Window',      sql: () => `SELECT sum(rt) FROM (SELECT sum(total) OVER (PARTITION BY customer_id ORDER BY order_date, id) rt FROM ${SRC})` },
];

// ---- progress ----
let step = 0, total = 1, t0 = 0, label = '';
const paint = () => { $('fill').style.width = (100 * step / total) + '%'; $('msg').textContent = `${step}/${total}  ${label}  ${((performance.now() - t0) / 1000).toFixed(1)}s`; };
const begin = l => { label = l; t0 = performance.now(); paint(); };

// ---- start ----
let info;
(async () => {
  try {
    info = await Engine.status();
    $('env').innerHTML = [
      ['Engine', `native ${info.version}`], ['Workers', info.workers], ['CPU logical cores', info.cores],
      ['Memory budget', (info.memory.budget / 1073741824).toFixed(1) + ' GB'], ['Process', info.is64 ? '64-bit' : '32-bit'],
    ].map(([k, v]) => `<span>${k}: <b>${v}</b></span>`).join('');
    const opts = [...new Set([1, 2, 4, 8, 16, 32, 64].filter(n => n <= info.workers).concat(info.workers))];
    $('threads').innerHTML = opts.map(n => `<label><input type="checkbox" value="${n}" ${n <= 4 || n === info.workers ? 'checked' : ''}> ${n}</label>`).join(' ');
    log(`Native engine ${info.version} ready (${info.workers} workers)`, 'ok');
    $('go').disabled = false;
  } catch (e) { $('env').textContent = 'Engine not available: ' + e.message; log(e.message, 'err'); console.error(e); }
})();

// Generated datasets (test-data/gen/<name>/) are listed too and read as dataset folders.
TestDataGen.list().then(list => list.forEach(m => $('data').insertAdjacentHTML('beforeend', `<option value="gen:${m.name}">${m.name} (${(m.rows / 1e6).toFixed(1)}M rows)</option>`)));
// Make sure <base>.parquet exists; build it from <base>.csv on first use.
async function ensureParquet(base) {
  if (base.startsWith('gen:')) return `${TestDataGen.DIR}/${base.slice(4)}`;
  const pq = base + '.parquet';
  if ((await DNFS.stat(pq)).exists) return pq;
  begin(`Converting ${base}.csv to Parquet (one time)`);
  const t = performance.now();
  const w = await Engine.exportTo({ sql: `SELECT * FROM read_csv(${Engine.lit(base + '.csv')})`, to: pq, format: 'parquet' });
  log(`Wrote ${pq}: ${(w.bytes / 1048576).toFixed(1)} MB in ${fmtMs(performance.now() - t)}`, 'ok');
  return pq;
}

// ---- benchmark ----
let results = null; // { threads: [..], q: { id: { [workers]: [ms...] } }, peak: { [workers]: bytes } }
$('go').onclick = guard(async () => {
  const threads = [...$('threads').querySelectorAll('input:checked')].map(c => +c.value).sort((a, b) => a - b);
  if (!threads.length) return log('Pick at least one worker count.', 'err');
  const runs = Math.max(1, +$('runs').value || 3);
  $('go').disabled = true;
  const tick = setInterval(paint, 100);
  try {
    step = 0; total = QUERIES.length * threads.length * (runs + 1);
    const pq = await ensureParquet($('data').value);
    if ($('source').value === 'table') {
      begin('Loading Parquet into an in-memory table');
      const t = await Engine.cache.load('bench_t', `SELECT * FROM read_parquet(${Engine.lit(pq)})`);
      log(`Loaded into engine memory in ${fmtMs(t.ms)} (${(t.bytes / 1048576).toFixed(0)} MB)`);
      SRC = 'bench_t';
    } else { await Engine.cache.drop('bench_t'); SRC = `read_parquet(${Engine.lit(pq)})`; }
    const rows = Number((await Engine.query(`SELECT count(*) FROM ${SRC}`)).rows[0][0]);
    log(`${pq}: ${rows.toLocaleString()} rows, source = ${$('source').value === 'table' ? 'in-memory table' : 'Parquet from disk'}`);

    results = { threads, q: {}, rows, peak: {} };
    for (const q of QUERIES) {
      results.q[q.id] = Object.fromEntries(threads.map(n => [n, []]));
      // Warm-up at each worker count, then interleave the runs so drift hits every count equally.
      for (const n of threads) { begin(`${q.label}: warm-up, ${n} worker(s)`); await timed(q.sql(), n); step++; }
      for (let r = 0; r < runs; r++) {
        for (const n of threads) {
          begin(`${q.label}: run ${r + 1}/${runs}, ${n} worker(s)`);
          results.q[q.id][n].push(await timed(q.sql(), n));
          const m = (await Engine.status()).memory; results.peak[n] = Math.max(results.peak[n] || 0, m.process);
          step++;
        }
      }
      log(`${q.label}: ` + threads.map(n => `${n}w ${fmtMs(med(results.q[q.id][n]))}`).join(', '), 'ok');
      render();
    }
    label = 'Done'; step = total; paint();
  } finally { clearInterval(tick); $('go').disabled = false; }
});

// ---- charts ----
const tip = $('tip');
const showTip = (e, t) => { tip.textContent = t; tip.style.display = 'block'; tip.style.left = e.clientX + 12 + 'px'; tip.style.top = e.clientY + 12 + 'px'; };
const hideTip = () => tip.style.display = 'none';
const nice = max => { const p = 10 ** Math.floor(Math.log10(max || 1)); for (const m of [1, 2, 5, 10]) if (m * p >= max) return m * p; return max; };

// Grouped bars: cats on x, one bar per series. ref = optional dashed reference value.
function bars(el, cats, series, unit, ref) {
  const W = 640, H = 290, L = 56, R = 8, T = 10, B = 30, iw = W - L - R, ih = H - T - B;
  const max = nice(Math.max(...series.flatMap(s => s.vals.map(v => v || 0)), ref || 0, 0.001));
  const y = v => T + ih - ih * v / max;
  const gw = iw / cats.length, bw = Math.min(26, (gw - 14) / series.length - 2);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for (let i = 0; i <= 4; i++) { const v = max * i / 4; s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${+v.toPrecision(3)}${unit}</text>`; }
  cats.forEach((c, i) => {
    const gx = L + gw * i + (gw - series.length * (bw + 2)) / 2;
    series.forEach((se, j) => {
      const v = se.vals[i]; if (v == null) return;
      const x = gx + j * (bw + 2), h = ih - (y(v) - T), r = Math.min(4, h / 2);
      s += `<path d="M${x},${T + ih} V${y(v) + r} Q${x},${y(v)} ${x + r},${y(v)} H${x + bw - r} Q${x + bw},${y(v)} ${x + bw},${y(v) + r} V${T + ih} Z" fill="${se.color}" data-tip="${c} · ${se.name}: ${se.fmt(v)}"/>`;
    });
    s += `<text x="${L + gw * i + gw / 2}" y="${H - 10}" text-anchor="middle">${c}</text>`;
  });
  if (ref) s += `<line class="ref" x1="${L}" x2="${W - R}" y1="${y(ref)}" y2="${y(ref)}"/>`;
  el.innerHTML = s + '</svg>';
  el.querySelectorAll('[data-tip]').forEach(p => { p.onmousemove = e => showTip(e, p.dataset.tip); p.onmouseleave = hideTip; });
}

function render() {
  const { threads, q } = results, done = QUERIES.filter(x => q[x.id]);
  const cats = done.map(x => x.label), base = threads[0];
  const series = threads.map((n, i) => ({ n, name: `${n} thread${n > 1 ? 's' : ''}`, color: COLORS[i % COLORS.length] }));
  const legend = series.map(s => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join('');
  $('lg1').innerHTML = $('lg2').innerHTML = legend;
  bars($('c1'), cats, series.map(s => ({ ...s, vals: done.map(x => med(q[x.id][s.n])), fmt: fmtMs })), ' ms');
  bars($('c2'), cats, series.map(s => ({ ...s, vals: done.map(x => med(q[x.id][base]) / med(q[x.id][s.n])), fmt: v => v.toFixed(2) + '×' })), '×', 1);
  $('c2').insertAdjacentHTML('beforeend', `<div class="note">Speedup = median time at ${base} thread${base > 1 ? 's' : ''} ÷ median time at N threads. Dashed line = no change.</div>`);

  const sum = n => done.reduce((a, x) => a + med(q[x.id][n]), 0);
  $('tbl').innerHTML = `<table><tr><th>Query</th>${threads.map(n => `<th>${n}w median</th><th>${n}w min / max</th>`).join('')}<th>Best speedup</th></tr>` +
    done.map(x => {
      const best = Math.max(...threads.map(n => med(q[x.id][base]) / med(q[x.id][n])));
      return `<tr><td>${x.label}</td>${threads.map(n => { const a = q[x.id][n]; return `<td>${fmtMs(med(a))}</td><td>${fmtMs(Math.min(...a))} / ${fmtMs(Math.max(...a))}</td>`; }).join('')}<td>${best.toFixed(2)}×</td></tr>`;
    }).join('') +
    `<tr><td><b>Total</b></td>${threads.map(n => `<td><b>${fmtMs(sum(n))}</b></td><td>${(sum(base) / sum(n)).toFixed(2)}×</td>`).join('')}<td></td></tr>` +
    `<tr><td>Peak engine process memory</td>${threads.map(n => `<td colspan="2">${((results.peak[n] || 0) / 1073741824).toFixed(2)} GiB</td>`).join('')}<td></td></tr></table>` +
    `<div class="note">${results.rows.toLocaleString()} rows. Each query gets one discarded warm-up per worker count; runs are interleaved across worker counts. Times are measured inside the engine (planning + execution), excluding the trip to the page. SQL:<br>${done.map(x => `<b>${x.label}</b>: <code>${x.sql().replace(/</g, '&lt;')}</code>`).join('<br>')}</div>`;
}
</script>
</body>
</html>
