<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Engine Test</title>
<script src="../js/core/theme.js"></script>
<link rel="stylesheet" href="../css/theme.css">
<style>
  textarea#sql { width: 100%; height: 110px; font-family: 'Syne Mono', ui-monospace, Consolas, monospace; }
  #path { min-width: 360px; }
  #out .table-wrap { max-height: 520px; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo">ET</span><div><h1>Engine Test</h1><div class="sub" id="sub">Native C# engine: SQL console</div></div></div>
  </header>
  <div class="main stack">
    <div class="row">
      <label class="field">Project file or dataset folder<input id="path" type="text" value="test-data/sales_1m.parquet" spellcheck="false"></label>
      <button id="open" class="ghost" disabled>Use project file</button>
    </div>
    <label class="field">SQL<textarea id="sql" spellcheck="false">SELECT 42 AS answer</textarea></label>
    <div class="row">
      <button id="run" disabled>Run SQL</button>
      <button id="save" disabled>Write query to test-data/export.parquet</button>
      <span id="status" class="muted"></span>
    </div>
    <div class="log" id="log"></div>
    <div id="out"></div>
  </div>
</div>

<script src="../js/dn-fs.js"></script>
<script src="../js/core/ui.js"></script>
<script src="../js/core/engine-client.js"></script>
<script>
const { $ } = UI;
const log = (msg, cls = '') => { const d = document.createElement('div'); d.className = cls; d.textContent = `${UI.stamp()}  ${msg}`; $('log').prepend(d); };
const guard = fn => async () => { try { await fn(); } catch (e) { log('FAILED: ' + e.message, 'err'); console.error(e); } };

guard(async () => {
  const s = await Engine.status();
  log(`Native engine ${s.version} ready (${s.workers} workers on ${s.cores} cores, memory budget ${(s.memory.budget / 1073741824).toFixed(1)} GB)`, 'ok');
  ['open', 'run', 'save'].forEach(id => $(id).disabled = false);
})();
$('open').onclick = guard(async () => {
  const p = $('path').value.trim(), o = await Engine.open(p);
  log(`Using ${p}: ${o.kind}, ${o.columns.length} columns${o.rows != null ? `, ${UI.num(o.rows)} rows` : ''}`, 'ok');
  $('sql').value = `SELECT * FROM ${Engine.src(p, o.tables?.[0])} LIMIT 100`;
});
$('run').onclick = guard(async () => {
  $('status').textContent = 'Running…';
  const t0 = performance.now();
  try {
    const r = await Engine.query($('sql').value, { limit: 1000 });
    UI.dataTable($('out'), r.cols, r.rows, { max: 1000 });
    log(`Query: ${UI.num(r.rowCount)} row(s)${r.truncated ? ' (first 1,000 shown)' : ''}, engine ${UI.ms(r.ms)}, total ${UI.ms(performance.now() - t0)}`, 'ok');
  } finally { $('status').textContent = ''; }
});
$('save').onclick = guard(async () => {
  const t0 = performance.now();
  const r = await Engine.exportTo({ sql: $('sql').value, to: 'test-data/export.parquet', format: 'parquet' }, j => $('status').textContent = `${j.stage || 'Working'}… ${UI.num(j.rowsProcessed)} rows`);
  $('status').textContent = '';
  log(`Wrote ${r.path}: ${UI.num(r.rows)} rows, ${UI.bytes(r.bytes)} in ${UI.ms(performance.now() - t0)}`, 'ok');
});
$('sql').addEventListener('keydown', ev => { if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) $('run').click(); });
</script>
</body>
</html>
