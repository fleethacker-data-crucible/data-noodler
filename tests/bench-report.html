<title>Arrow Engine Benchmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Syne+Mono&display=swap">
<style>
/* Layout: one narrow column like a lab report — verdict first, then the rows/s chart, then the full table and notes. */
:root {
  --bg: #f3f5f8; --panel: #ffffff; --panel-2: #eef1f5; --border: #d6dce5; --text: #1b2330; --muted: #5d6878;
  --old: #8a94a6; --pq: #6d8fd6; --ar: #2f9e8f; --mem: #e0612b; --good: #1f8a4c; --grid: #e4e8ee;
  --ui: 'Exo 2', 'Segoe UI', system-ui, sans-serif; --mono: 'Syne Mono', ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161c; --panel: #1a2029; --panel-2: #212833; --border: #2e3744; --text: #e3e8ef; --muted: #8f9aab;
  --old: #7d879a; --pq: #7f9fe3; --ar: #3cbcaa; --mem: #ff7a45; --good: #45c27a; --grid: #262e39; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161c; --panel: #1a2029; --panel-2: #212833; --border: #2e3744; --text: #e3e8ef; --muted: #8f9aab;
  --old: #7d879a; --pq: #7f9fe3; --ar: #3cbcaa; --mem: #ff7a45; --good: #45c27a; --grid: #262e39; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--ui); margin: 0; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; display: grid; gap: 20px; }
header { display: flex; gap: 14px; align-items: center; }
.logo { width: 44px; height: 44px; border-radius: 6px; background: var(--mem); color: #fff; display: grid; place-items: center; font-weight: 700; letter-spacing: .04em; flex: none; }
h1 { margin: 0; font-size: 26px; font-weight: 600; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; }
h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
section { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; min-width: 0; }
.verdict { display: grid; gap: 14px; }
.verdict p { margin: 0; max-width: 70ch; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.tile { background: var(--panel-2); border-radius: 4px; padding: 10px 12px; display: grid; gap: 2px; }
.tile b { font: 400 26px/1.1 var(--mono); color: var(--mem); font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; margin-bottom: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.chart { display: grid; gap: 12px; }
.row { display: grid; grid-template-columns: minmax(150px, 230px) 1fr; gap: 10px; align-items: center; }
.row .lbl { font-size: 13px; }
.row .lbl small { display: block; color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.bars { display: grid; gap: 2px; position: relative; padding-right: 64px; }
.bar { height: 9px; border-radius: 0 2px 2px 0; position: relative; min-width: 2px; }
.bar em { position: absolute; left: calc(100% + 6px); top: -4px; font: 11px/1 var(--mono); color: var(--muted); font-style: normal; white-space: nowrap; }
.axis { display: grid; grid-template-columns: minmax(150px, 230px) 1fr; gap: 10px; font: 11px var(--mono); color: var(--muted); }
.ticks { position: relative; height: 14px; margin-right: 64px; }
.ticks span { position: absolute; transform: translateX(-50%); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; white-space: normal; min-width: 170px; }
th { font-weight: 600; color: var(--muted); font-size: 12px; }
td.num { font-family: var(--mono); }
td.up { color: var(--good); font-weight: 600; font-family: var(--mono); }
td.down { color: var(--mem); font-family: var(--mono); }
.toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
.toggle button { font: 500 12px var(--ui); background: transparent; color: var(--text); border: 0; padding: 5px 12px; cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--mem); color: #fff; }
.toggle button:focus-visible { outline: 2px solid var(--pq); outline-offset: -2px; }
.notes { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.notes p { margin: 0; max-width: 80ch; }
@media (max-width: 560px) { .row, .axis { grid-template-columns: 1fr; } .axis > :first-child { display: none; } .bar em { position: static; display: inline; margin-left: 6px; } }
</style>

<div class="wrap">
  <header>
    <div class="logo">DN</div>
    <div><h1>Arrow Engine Benchmark</h1><div class="sub" id="sub"></div></div>
  </header>

  <section class="verdict">
    <h2>Verdict</h2>
    <p id="verdict"></p>
    <div class="tiles" id="tiles"></div>
  </section>

  <section>
    <h2>Rows per second, per step (log scale, longer is faster)</h2>
    <div class="legend" id="legend"></div>
    <div class="chart" id="chart"></div>
    <div class="axis"><div></div><div class="ticks" id="ticks"></div></div>
  </section>

  <section>
    <h2>Every step</h2>
    <div class="toggle" role="group" aria-label="Show"><button id="tMs" aria-pressed="true">Time (ms)</button><button id="tRps" aria-pressed="false">Rows / s</button></div>
    <div class="scroll"><table id="table"></table></div>
  </section>

  <section>
    <h2>Optimization rounds: Arrow + memory, first build vs final</h2>
    <div class="scroll"><table id="rounds"></table></div>
  </section>

  <section class="notes">
    <h2>How it was measured</h2>
    <div id="notes"></div>
  </section>
</div>

<script>
const D = /*DATA*/null;
const K = ['old', 'pq', 'ar', 'mem'];
const COL = { old: 'var(--old)', pq: 'var(--pq)', ar: 'var(--ar)', mem: 'var(--mem)' };
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('en-US');
const ms = x => x >= 100 ? fmt(Math.round(x)) : x.toFixed(1);
const rps = x => x >= 1e6 ? (x / 1e6).toFixed(x >= 1e8 ? 0 : 1) + 'M' : (x / 1e3).toFixed(0) + 'k';
const sp = (a, b) => a / b;
const m = D.machine;
$('sub').textContent = `${fmt(D.rows)} rows (${fmt(D.csvMB)} MB CSV) · ${m.cores} cores · ${m.ramGB} GB RAM · PowerShell ${m.ps} / .NET ${m.clr} · old engine = commit ${D.oldRef}`;
const S = D.summary.mem;
const step = n => D.steps.find(s => s.step === n);
const imp = step('Import CSV -> dataset (write)'), join = step('Hash join fact x dim + group'), top = step('ORDER BY double LIMIT 100');
$('verdict').textContent = `Arrow on disk plus resident in-memory datasets wins and is now the engine's default. Across all ${D.steps.length} steps it is ${S.all.toFixed(1)}× faster than the old engine (geometric mean), and ${S.query.toFixed(1)}× on the query steps alone. Every answer matched the old engine.` + (() => { const slow = D.steps.filter(s => s.old.ms / s.mem.ms < 1); return slow.length ? ` Not faster: ${slow.map(s => `${s.step} (${(s.old.ms / s.mem.ms).toFixed(1)}×)`).join(', ')}; repeat runs vary by about ±10%.` : ''; })();
const tiles = [
  [`${S.all.toFixed(1)}×`, 'faster overall (geometric mean of every step)'],
  [`${sp(imp.old.ms, imp.mem.ms).toFixed(1)}×`, `CSV import: ${(imp.old.ms / 1000).toFixed(1)} s → ${(imp.mem.ms / 1000).toFixed(1)} s`],
  [`${sp(join.old.ms, join.mem.ms).toFixed(1)}×`, `hash join: ${ms(join.old.ms)} → ${ms(join.mem.ms)} ms`],
  [`${sp(top.old.ms, top.mem.ms).toFixed(1)}×`, `ORDER BY … LIMIT: ${ms(top.old.ms)} → ${ms(top.mem.ms)} ms`],
];
if (D.load) tiles.push([`${(D.load.ms / 1000).toFixed(1)} s`, `to load ${fmt(D.rows)} rows into memory (${fmt(D.load.mb)} MB)`]);
$('tiles').innerHTML = tiles.map(([b, s]) => `<div class="tile"><b>${b}</b><span>${s}</span></div>`).join('');
$('legend').innerHTML = K.map(k => `<span><i style="background:${COL[k]}"></i>${D.names[k]}</span>`).join('');

// Log scale for rows/s.
const all = D.steps.flatMap(s => K.map(k => s[k]?.rps).filter(Boolean));
const lo = Math.pow(10, Math.floor(Math.log10(Math.min(...all)))), hi = Math.pow(10, Math.ceil(Math.log10(Math.max(...all))));
const pos = v => (Math.log10(v) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)) * 100;
$('chart').innerHTML = D.steps.map(s => `<div class="row"><div class="lbl"><small>${s.group}</small>${s.step}</div><div class="bars">${K.map(k => s[k] ? `<div class="bar" style="width:${pos(s[k].rps).toFixed(2)}%;background:${COL[k]}" title="${D.names[k]}: ${fmt(s[k].rps)} rows/s"><em>${rps(s[k].rps)}</em></div>` : '').join('')}</div></div>`).join('');
const ticks = []; for (let v = lo; v <= hi; v *= 10) ticks.push(v);
$('ticks').innerHTML = ticks.map(v => `<span style="left:${pos(v).toFixed(2)}%">${rps(v)}</span>`).join('');

let mode = 'ms';
function table() {
  const head = `<tr><th>Step</th>${K.map(k => `<th>${D.names[k]}</th>`).join('')}<th>Old → Arrow + memory</th></tr>`;
  const body = D.steps.map(s => {
    const x = sp(s.old.ms, s.mem.ms);
    return `<tr><td>${s.step}</td>${K.map(k => `<td class="num">${s[k] ? (mode === 'ms' ? ms(s[k].ms) : fmt(s[k].rps)) : ''}</td>`).join('')}<td class="${x >= 1 ? 'up' : 'down'}">${x.toFixed(1)}×</td></tr>`;
  }).join('');
  const disk = `<tr><td>Dataset on disk (MB)</td>${K.map(k => `<td class="num">${fmt(D.disk[k])}</td>`).join('')}<td></td></tr>`;
  const peak = `<tr><td>Peak process memory (MB)</td>${K.map(k => `<td class="num">${fmt(D.peak[k])}</td>`).join('')}<td></td></tr>`;
  $('table').innerHTML = head + body + disk + peak;
}
$('tMs').onclick = () => { mode = 'ms'; $('tMs').setAttribute('aria-pressed', 'true'); $('tRps').setAttribute('aria-pressed', 'false'); table(); };
$('tRps').onclick = () => { mode = 'rps'; $('tRps').setAttribute('aria-pressed', 'true'); $('tMs').setAttribute('aria-pressed', 'false'); table(); };
table();

const r = D.steps.filter(s => s.r1mem);
$('rounds').innerHTML = `<tr><th>Step</th><th>First Arrow + memory build (ms)</th><th>Final (ms)</th><th>Change</th></tr>` + r.map(s => {
  const x = sp(s.r1mem.ms, s.mem.ms);
  return `<tr><td>${s.step}</td><td class="num">${ms(s.r1mem.ms)}</td><td class="num">${ms(s.mem.ms)}</td><td class="${x >= 1 ? 'up' : 'down'}">${x.toFixed(1)}×</td></tr>`;
}).join('');

$('notes').innerHTML = [
  `Each setup ran in its own fresh PowerShell process on the same generated data: a ${fmt(D.rows)}-row, 11-column CSV (ints, decimals, a 10k-value text key, a 1M-value text column, dates, 5% NULLs) and a 10,000-row dimension table. Query steps ran 3 times; the median is shown. Measured ${D.when.replace('T', ' ')}.`,
  `Old engine = the app before this work (Parquet datasets, read from disk on every query). New · Parquet = new engine with Parquet datasets, no memory. New · Arrow on disk = Arrow IPC datasets, read from disk. New · Arrow + memory = Arrow datasets held resident in engine memory (the app's default now).`,
  `Rows/s = rows the step works through (the 10M-row table; the window step runs on 1M rows) divided by its time. Repeat runs of the same setup differ by about ±5-10%.`,
  `Every step's answer (row count, first value) matched across all four setups; the SQL, Arrow and CSV test suites (tests/) compare every value.`,
].map(t => `<p>${t}</p>`).join('');
</script>
