<script>
// Oracle SQL: everything the engine (server/data-engine/Query/*.cs, server/data-engine/Core/Script.cs) understands, per
// .claude/docs/SQL_DIALECT.md. [name, category, syntax, description, example]
const L = [
// ---- query clauses ----
['SELECT', 'Clause', 'SELECT [DISTINCT | UNIQUE | ALL] expr [[AS] alias], ... FROM source', 'Returns columns or computed values. * selects every column; t.* every column of one table.', 'SELECT EMP_ID, HOURS * RATE AS PAY FROM EMPLOYEE_HOURS'],
['DISTINCT / UNIQUE', 'Clause', 'SELECT DISTINCT expr, ... | SELECT UNIQUE expr, ...', 'Removes duplicate rows from the result (UNIQUE is the same as DISTINCT).', 'SELECT DISTINCT DEPARTMENT FROM EMPLOYEE_HOURS'],
['FROM', 'Clause', 'FROM dataset [alias] | FROM (subquery) alias', 'Names the input dataset, view, CTE or subquery to read from. A table alias has no AS.', 'SELECT * FROM EMPLOYEE_HOURS e'],
['DUAL', 'Clause', 'SELECT expr FROM DUAL', 'A one-row table for selecting values that need no table.', 'SELECT SYSDATE FROM DUAL'],
['WHERE', 'Clause', 'WHERE condition', 'Keeps only rows where the condition is true.', "SELECT * FROM EMPLOYEE_HOURS WHERE HOURS > 40 AND DEPARTMENT = 'Sales'"],
['GROUP BY', 'Clause', 'GROUP BY expr, ...', 'Groups rows that share values so aggregates are computed per group. List every non-aggregate column.', 'SELECT DEPARTMENT, SUM(HOURS) FROM EMPLOYEE_HOURS GROUP BY DEPARTMENT'],
['HAVING', 'Clause', 'HAVING aggregate_condition', 'Filters groups after GROUP BY.', 'SELECT DEPARTMENT, COUNT(*) AS N FROM EMPLOYEE_HOURS GROUP BY DEPARTMENT HAVING COUNT(*) > 10'],
['ORDER BY', 'Clause', 'ORDER BY expr [ASC|DESC] [NULLS FIRST|LAST], ...', 'Sorts the result.', 'SELECT * FROM EMPLOYEE_HOURS ORDER BY WORK_DATE DESC NULLS LAST'],
['OFFSET / FETCH FIRST', 'Clause', '[OFFSET m ROWS] FETCH {FIRST | NEXT} n ROWS ONLY', 'Returns at most n rows, optionally skipping the first m. Goes after ORDER BY.', 'SELECT * FROM EMPLOYEE_HOURS ORDER BY HOURS DESC OFFSET 20 ROWS FETCH NEXT 10 ROWS ONLY'],
['ROWNUM', 'Clause', 'WHERE ROWNUM <= n | SELECT ROWNUM, ...', 'Row number as rows are read, before ORDER BY (like Oracle). For the top n of a sorted result use FETCH FIRST.', 'SELECT * FROM EMPLOYEE_HOURS WHERE ROWNUM <= 10'],
['WITH (CTE)', 'Clause', 'WITH name [(cols)] AS (query) [, name2 AS (query)] SELECT ...', 'Common table expression: a named subquery used by the main query. A CTE that names itself is recursive (anchor UNION ALL recursive part; no RECURSIVE keyword).', 'WITH n (i) AS (SELECT 1 FROM DUAL UNION ALL SELECT i + 1 FROM n WHERE i < 10)\nSELECT * FROM n'],
['UNION / UNION ALL', 'Set operation', 'query UNION [ALL] query', 'Stacks two results. UNION removes duplicates, UNION ALL keeps them.', 'SELECT EMP_ID FROM A UNION ALL SELECT EMP_ID FROM B'],
['INTERSECT', 'Set operation', 'query INTERSECT query', 'Rows present in both results.', 'SELECT EMP_ID FROM A INTERSECT SELECT EMP_ID FROM B'],
['MINUS', 'Set operation', 'query MINUS query', 'Rows in the first result that are not in the second.', 'SELECT EMP_ID FROM A MINUS SELECT EMP_ID FROM B'],
['PIVOT', 'Clause', 'PIVOT (aggregate(col) FOR col IN (v1 [AS] alias, v2, ...))', 'Turns row values into columns.', "SELECT * FROM EMPLOYEE_HOURS PIVOT (SUM(HOURS) FOR DEPARTMENT IN ('Sales' AS SALES, 'Ops' AS OPS))"],
['ROLLUP', 'Grouping', 'GROUP BY ROLLUP (a, b, ...)', 'Groups plus subtotals for each leading prefix and a grand total.', 'SELECT REGION, DEPARTMENT, SUM(HOURS) FROM EMPLOYEE_HOURS GROUP BY ROLLUP (REGION, DEPARTMENT)'],
['CUBE', 'Grouping', 'GROUP BY CUBE (a, b, ...)', 'Subtotals for every combination of the listed columns.', 'SELECT REGION, DEPARTMENT, SUM(HOURS) FROM EMPLOYEE_HOURS GROUP BY CUBE (REGION, DEPARTMENT)'],
['GROUPING SETS', 'Grouping', 'GROUP BY GROUPING SETS ((a, b), (a), ())', 'Computes several groupings in one query.', 'SELECT REGION, DEPARTMENT, SUM(HOURS) FROM EMPLOYEE_HOURS GROUP BY GROUPING SETS ((REGION), (DEPARTMENT), ())'],
// ---- joins ----
['INNER JOIN', 'Join', 'FROM a [INNER] JOIN b ON condition | USING (col)', 'Rows that match in both tables.', 'SELECT * FROM EMPLOYEE_HOURS h JOIN EMPLOYEES e ON h.EMP_ID = e.EMP_ID'],
['LEFT JOIN', 'Join', 'FROM a LEFT [OUTER] JOIN b ON condition', 'All rows from the left table, matched rows from the right (NULL when none).', 'SELECT * FROM EMPLOYEES e LEFT JOIN EMPLOYEE_HOURS h ON h.EMP_ID = e.EMP_ID'],
['RIGHT JOIN', 'Join', 'FROM a RIGHT [OUTER] JOIN b ON condition', 'All rows from the right table, matched rows from the left.', 'SELECT * FROM EMPLOYEE_HOURS h RIGHT JOIN EMPLOYEES e ON h.EMP_ID = e.EMP_ID'],
['FULL JOIN', 'Join', 'FROM a FULL [OUTER] JOIN b ON condition', 'All rows from both tables, matched where possible.', 'SELECT * FROM A FULL JOIN B ON A.ID = B.ID'],
['CROSS JOIN', 'Join', 'FROM a CROSS JOIN b', 'Every combination of rows (Cartesian product).', 'SELECT * FROM SIZES CROSS JOIN COLORS'],
['Comma join', 'Join', 'FROM a, b WHERE condition', 'Tables listed with commas, joined by the WHERE condition.', 'SELECT * FROM EMPLOYEE_HOURS h, EMPLOYEES e WHERE h.EMP_ID = e.EMP_ID'],
// ---- operators / predicates ----
['AND / OR / NOT', 'Operator', 'cond AND cond | cond OR cond | NOT cond', 'Combine or negate conditions.', "WHERE HOURS > 8 AND NOT (DEPARTMENT = 'Ops' OR DEPARTMENT = 'IT')"],
['Arithmetic', 'Operator', 'a + b, a - b, a * b, a / b', 'Add, subtract, multiply, divide (remainder: MOD). Date + n / date - n adds / subtracts days (fractions = hours ...); date1 - date2 = days as a number.', 'SELECT HOURS * RATE AS PAY, WORK_DATE + 7 AS NEXT_WEEK FROM EMPLOYEE_HOURS'],
['|| (concatenate)', 'Operator', "text || text", "Joins text values. NULL parts are skipped ('a' || NULL = 'a').", "SELECT FIRST_NAME || ' ' || LAST_NAME AS NAME FROM EMPLOYEES"],
['Comparison', 'Operator', '=, <>, !=, <, <=, >, >=', "Compares two values. Comparing with NULL gives NULL. '' is NULL, so = '' never matches: use IS NULL.", 'WHERE HOURS >= 40'],
['BETWEEN', 'Predicate', 'expr [NOT] BETWEEN low AND high', 'True when the value is in the range (inclusive).', "WHERE WORK_DATE BETWEEN DATE '2026-01-01' AND DATE '2026-03-31'"],
['IN', 'Predicate', 'expr [NOT] IN (v1, v2, ...) | IN (subquery)', 'True when the value equals one in the list or subquery.', "WHERE DEPARTMENT IN ('Sales', 'Ops')"],
['LIKE', 'Predicate', "expr [NOT] LIKE 'pattern' [ESCAPE 'c']", 'Pattern match: % = any text, _ = one character. Case sensitive: for any case compare UPPER(expr) LIKE UPPER(pattern).', "WHERE UPPER(EMAIL) LIKE UPPER('%@gmail.com')"],
['IS NULL', 'Predicate', 'expr IS [NOT] NULL', "Tests for missing values. Empty text ('') is NULL.", 'WHERE END_DATE IS NULL'],
['EXISTS', 'Predicate', '[NOT] EXISTS (subquery)', 'True when the subquery returns at least one row.', 'SELECT * FROM EMPLOYEES e WHERE EXISTS (SELECT 1 FROM EMPLOYEE_HOURS h WHERE h.EMP_ID = e.EMP_ID)'],
['ANY / SOME / ALL', 'Predicate', 'expr op ANY | SOME | ALL (subquery)', 'Compares a value to every row of a subquery: ANY/SOME = at least one, ALL = every one.', 'WHERE HOURS > ALL (SELECT HOURS FROM EMPLOYEE_HOURS WHERE DEPARTMENT = \'IT\')'],
['CASE', 'Expression', 'CASE WHEN cond THEN v [WHEN ...] [ELSE v] END\nCASE expr WHEN val THEN v ... END', 'Conditional value.', "SELECT CASE WHEN HOURS > 40 THEN 'Overtime' ELSE 'Regular' END AS KIND FROM EMPLOYEE_HOURS"],
['CAST', 'Expression', 'CAST(expr AS type [DEFAULT value ON CONVERSION ERROR])', 'Converts to another type (VARCHAR2(n), NUMBER(p,s), INTEGER, BINARY_DOUBLE, DATE, TIMESTAMP, BOOLEAN ...). Fails on bad values unless DEFAULT ... ON CONVERSION ERROR gives a value (often NULL) instead.', "SELECT CAST(EMP_ID AS VARCHAR2(20)), CAST(RAW_HOURS AS NUMBER DEFAULT NULL ON CONVERSION ERROR) FROM EMPLOYEE_HOURS"],
['EXTRACT', 'Expression', 'EXTRACT(YEAR | MONTH | DAY | HOUR | MINUTE | SECOND FROM d)', 'A part of a date or timestamp.', 'SELECT EXTRACT(YEAR FROM WORK_DATE) FROM EMPLOYEE_HOURS'],
['INTERVAL', 'Expression', "INTERVAL 'n' DAY | HOUR | MINUTE | SECOND | MONTH | YEAR", 'A time span to add to or subtract from dates.', "SELECT WORK_DATE + INTERVAL '30' DAY FROM EMPLOYEE_HOURS"],
['Literals', 'Expression', "'text', q'[text]', N'text', 123, 1.5, TRUE, FALSE, NULL, DATE 'YYYY-MM-DD', TIMESTAMP 'YYYY-MM-DD HH24:MI:SS'", "Constant values. q'[...]' holds quotes without doubling them. '' is NULL.", "SELECT DATE '2026-01-01', q'[it's]', NULL FROM DUAL"],
['Scalar subquery', 'Expression', '(SELECT one_value ...)', 'A subquery returning one row and one column, used as a value. More than one row is an error.', 'SELECT EMP_ID, HOURS - (SELECT AVG(HOURS) FROM EMPLOYEE_HOURS) AS DIFF FROM EMPLOYEE_HOURS'],
// ---- aggregates ----
['COUNT', 'Aggregate', 'COUNT(*) | COUNT([DISTINCT] expr)', 'Number of rows, or of non-NULL (distinct) values. Counting rows that match: COUNT(CASE WHEN cond THEN 1 END).', 'SELECT COUNT(*), COUNT(DISTINCT EMP_ID), COUNT(CASE WHEN HOURS > 40 THEN 1 END) FROM EMPLOYEE_HOURS'],
['SUM', 'Aggregate', 'SUM(expr)', 'Total of the values. Summing only some rows: SUM(CASE WHEN cond THEN x END).', "SELECT SUM(HOURS), SUM(CASE WHEN DEPARTMENT = 'Ops' THEN HOURS END) FROM EMPLOYEE_HOURS"],
['AVG', 'Aggregate', 'AVG(expr)', 'Average of the values.', 'SELECT AVG(HOURS) FROM EMPLOYEE_HOURS'],
['MIN / MAX', 'Aggregate', 'MIN(expr), MAX(expr)', 'Smallest / largest value.', 'SELECT MIN(WORK_DATE), MAX(WORK_DATE) FROM EMPLOYEE_HOURS'],
['MEDIAN', 'Aggregate', 'MEDIAN(expr)', 'Middle value.', 'SELECT MEDIAN(HOURS) FROM EMPLOYEE_HOURS'],
['STATS_MODE', 'Aggregate', 'STATS_MODE(expr)', 'Most frequent value.', 'SELECT STATS_MODE(DEPARTMENT) FROM EMPLOYEE_HOURS'],
['PERCENTILE_CONT', 'Aggregate', 'PERCENTILE_CONT(fraction) WITHIN GROUP (ORDER BY expr)', 'Interpolated percentile (0.9 = 90th percentile).', 'SELECT PERCENTILE_CONT(0.9) WITHIN GROUP (ORDER BY HOURS) FROM EMPLOYEE_HOURS'],
['PERCENTILE_DISC', 'Aggregate', 'PERCENTILE_DISC(fraction) WITHIN GROUP (ORDER BY expr)', 'Percentile that returns an actual value from the data.', 'SELECT PERCENTILE_DISC(0.5) WITHIN GROUP (ORDER BY HOURS) FROM EMPLOYEE_HOURS'],
['STDDEV / STDDEV_SAMP / STDDEV_POP', 'Aggregate', 'STDDEV(expr)', 'Standard deviation (sample, or population with _POP).', 'SELECT STDDEV(HOURS) FROM EMPLOYEE_HOURS'],
['VARIANCE / VAR_SAMP / VAR_POP', 'Aggregate', 'VARIANCE(expr)', 'Variance (sample, or population with _POP).', 'SELECT VAR_POP(HOURS) FROM EMPLOYEE_HOURS'],
['LISTAGG', 'Aggregate', "LISTAGG(expr [, 'separator']) WITHIN GROUP (ORDER BY ...)", 'Joins the group\'s text values into one string, in the given order.', "SELECT DEPARTMENT, LISTAGG(LAST_NAME, ', ') WITHIN GROUP (ORDER BY LAST_NAME) FROM EMPLOYEES GROUP BY DEPARTMENT"],
['ANY_VALUE', 'Aggregate', 'ANY_VALUE(expr)', 'Any one value from the group.', 'SELECT EMP_ID, ANY_VALUE(LAST_NAME) FROM EMPLOYEE_HOURS GROUP BY EMP_ID'],
['APPROX_COUNT_DISTINCT', 'Aggregate', 'APPROX_COUNT_DISTINCT(expr)', 'Number of distinct values.', 'SELECT APPROX_COUNT_DISTINCT(EMP_ID) FROM EMPLOYEE_HOURS'],
// ---- analytic (window) ----
['OVER', 'Window', 'func(...) OVER ([PARTITION BY ...] [ORDER BY ...] [ROWS|RANGE BETWEEN ... AND ...])', 'Analytic function: computed over a window of related rows without collapsing them. Any aggregate can be used with OVER. To filter on it, wrap the query in a subquery.', 'SELECT EMP_ID, HOURS, SUM(HOURS) OVER (PARTITION BY EMP_ID ORDER BY WORK_DATE ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS RUNNING FROM EMPLOYEE_HOURS'],
['ROW_NUMBER', 'Window', 'ROW_NUMBER() OVER (...)', 'Sequential number 1, 2, 3 ... within the window. Latest row per key: filter RN = 1 in an outer query.', 'SELECT * FROM (SELECT h.*, ROW_NUMBER() OVER (PARTITION BY EMP_ID ORDER BY WORK_DATE DESC) AS RN FROM EMPLOYEE_HOURS h) WHERE RN = 1'],
['RANK', 'Window', 'RANK() OVER (ORDER BY ...)', 'Rank with gaps after ties (1, 1, 3).', 'SELECT EMP_ID, RANK() OVER (ORDER BY HOURS DESC) FROM EMPLOYEE_HOURS'],
['DENSE_RANK', 'Window', 'DENSE_RANK() OVER (ORDER BY ...)', 'Rank without gaps (1, 1, 2).', 'SELECT EMP_ID, DENSE_RANK() OVER (ORDER BY HOURS DESC) FROM EMPLOYEE_HOURS'],
['PERCENT_RANK', 'Window', 'PERCENT_RANK() OVER (ORDER BY ...)', 'Relative rank from 0 to 1.', 'SELECT PERCENT_RANK() OVER (ORDER BY HOURS) FROM EMPLOYEE_HOURS'],
['CUME_DIST', 'Window', 'CUME_DIST() OVER (ORDER BY ...)', 'Fraction of rows at or below this one.', 'SELECT CUME_DIST() OVER (ORDER BY HOURS) FROM EMPLOYEE_HOURS'],
['NTILE', 'Window', 'NTILE(n) OVER (ORDER BY ...)', 'Splits rows into n roughly equal buckets numbered 1..n.', 'SELECT EMP_ID, NTILE(4) OVER (ORDER BY HOURS) AS QUARTILE FROM EMPLOYEE_HOURS'],
['LAG', 'Window', 'LAG(expr [, offset [, default]]) OVER (...)', 'Value from a previous row.', 'SELECT WORK_DATE, HOURS - LAG(HOURS) OVER (PARTITION BY EMP_ID ORDER BY WORK_DATE) FROM EMPLOYEE_HOURS'],
['LEAD', 'Window', 'LEAD(expr [, offset [, default]]) OVER (...)', 'Value from a following row.', 'SELECT WORK_DATE, LEAD(WORK_DATE) OVER (PARTITION BY EMP_ID ORDER BY WORK_DATE) FROM EMPLOYEE_HOURS'],
['FIRST_VALUE / LAST_VALUE', 'Window', 'FIRST_VALUE(expr) OVER (...)', 'First / last value in the window frame.', 'SELECT FIRST_VALUE(HOURS) OVER (PARTITION BY EMP_ID ORDER BY WORK_DATE) FROM EMPLOYEE_HOURS'],
// ---- math ----
['ABS', 'Math', 'ABS(x)', 'Absolute value.', 'SELECT ABS(-5) FROM DUAL  -- 5'],
['ROUND', 'Math', 'ROUND(x [, decimals])', 'Rounds to the given decimals (default 0).', 'SELECT ROUND(HOURS * RATE, 2) FROM EMPLOYEE_HOURS'],
['FLOOR / CEIL', 'Math', 'FLOOR(x), CEIL(x)', 'Round down / up to a whole number.', 'SELECT FLOOR(7.8), CEIL(7.2) FROM DUAL  -- 7, 8'],
['TRUNC', 'Math', 'TRUNC(x [, decimals])', 'Drops digits after the given decimals (default: the fractional part).', 'SELECT TRUNC(-7.8), TRUNC(3.14159, 2) FROM DUAL  -- -7, 3.14'],
['SQRT', 'Math', 'SQRT(x)', 'Square root.', 'SELECT SQRT(16) FROM DUAL'],
['POWER', 'Math', 'POWER(x, y)', 'x raised to the power y.', 'SELECT POWER(2, 10) FROM DUAL  -- 1024'],
['MOD / REMAINDER', 'Math', 'MOD(x, y), REMAINDER(x, y)', 'Remainder of x / y (MOD truncates the quotient, REMAINDER rounds it).', 'SELECT MOD(17, 5) FROM DUAL  -- 2'],
['EXP / LN / LOG', 'Math', 'EXP(x), LN(x), LOG(base, x)', 'e^x, natural log, log in the given base.', 'SELECT LN(EXP(1)), LOG(10, 1000) FROM DUAL'],
['SIGN', 'Math', 'SIGN(x)', '-1, 0 or 1 by the sign of x.', 'SELECT SIGN(-3) FROM DUAL'],
['SIN / COS / TAN / ASIN / ACOS / ATAN / ATAN2', 'Math', 'SIN(x), ATAN2(y, x)', 'Trigonometry in radians. SINH / COSH / TANH are the hyperbolic forms.', 'SELECT SIN(30 * ACOS(-1) / 180) FROM DUAL'],
['BITAND', 'Math', 'BITAND(a, b)', 'Bitwise AND of two whole numbers.', 'SELECT BITAND(FLAGS, 4) FROM SETTINGS'],
['GREATEST / LEAST', 'Math', 'GREATEST(a, b, ...), LEAST(a, b, ...)', 'Largest / smallest of the arguments.', 'SELECT GREATEST(HOURS, 0), LEAST(HOURS, 12) FROM EMPLOYEE_HOURS'],
['ORA_HASH', 'Math', 'ORA_HASH(expr)', 'A hash of the value (for keys or sampling).', 'SELECT ORA_HASH(EMP_ID) AS ROW_KEY FROM EMPLOYEE_HOURS'],
// ---- text ----
['LOWER / UPPER / INITCAP', 'Text', 'LOWER(text), UPPER(text), INITCAP(text)', 'Lower case, upper case, first letter of each word capital.', "SELECT INITCAP('jane DOE') FROM DUAL  -- Jane Doe"],
['TRIM / LTRIM / RTRIM', 'Text', "TRIM([LEADING|TRAILING|BOTH] [c FROM] text), LTRIM(text [, set]), RTRIM(text [, set])", 'Removes spaces (or the given characters) from both ends / the left / the right.', "SELECT TRIM('  hi  '), LTRIM('0042', '0') FROM DUAL  -- 'hi', '42'"],
['LENGTH', 'Text', 'LENGTH(text)', "Number of characters (NULL for '', which is NULL).", "SELECT LENGTH('hello') FROM DUAL  -- 5"],
['SUBSTR', 'Text', 'SUBSTR(text, start [, length])', 'Part of a text, start is 1-based (negative counts from the end). First / last n characters: SUBSTR(t, 1, n) / SUBSTR(t, -n).', "SELECT SUBSTR('ABCDEF', 2, 3), SUBSTR(ZIP, 1, 3) FROM EMPLOYEES  -- 'BCD'"],
['INSTR', 'Text', 'INSTR(text, search [, start [, occurrence]])', '1-based position of search in text, 0 when absent. Contains: INSTR(t, s) > 0.', "SELECT INSTR(EMAIL, '@') FROM EMPLOYEES"],
['REPLACE', 'Text', 'REPLACE(text, find [, replacement])', 'Replaces every occurrence (removes it when no replacement is given).', "SELECT REPLACE(PHONE, '-') FROM EMPLOYEES"],
['TRANSLATE', 'Text', 'TRANSLATE(text, from_chars, to_chars)', 'Replaces each character of from_chars with the one at the same place in to_chars.', "SELECT TRANSLATE(PHONE, '()-', '   ') FROM EMPLOYEES"],
['CONCAT', 'Text', 'CONCAT(a, b)', 'Joins two values as text (NULLs are skipped). For more, use ||.', "SELECT CONCAT(FIRST_NAME, LAST_NAME) FROM EMPLOYEES"],
['LPAD / RPAD', 'Text', 'LPAD(text, length [, fill])', 'Pads text on the left / right to the length.', "SELECT LPAD(TO_CHAR(EMP_ID), 6, '0') FROM EMPLOYEES  -- 000042"],
['CHR / ASCII', 'Text', 'CHR(n), ASCII(text)', 'Character for a code / code of the first character.', "SELECT CHR(65), ASCII('A') FROM DUAL  -- 'A', 65"],
['REVERSE', 'Text', 'REVERSE(text)', 'Characters in reverse order.', "SELECT REVERSE('abc') FROM DUAL  -- 'cba'"],
['SOUNDEX', 'Text', 'SOUNDEX(text)', 'Sound code for matching names that sound alike.', "SELECT * FROM EMPLOYEES WHERE SOUNDEX(LAST_NAME) = SOUNDEX('Smyth')"],
['REGEXP_LIKE', 'Text', "REGEXP_LIKE(text, pattern [, 'i'])", "True when the regular expression matches anywhere in text ('i' = any case). Use ^...$ to match the whole text.", "WHERE REGEXP_LIKE(ZIP, '^[0-9]{5}$')"],
['REGEXP_SUBSTR', 'Text', 'REGEXP_SUBSTR(text, pattern [, start [, occurrence [, flags [, group]]]])', 'The matched text (or a capture group), NULL when no match. The n-th piece of a delimited text: REGEXP_SUBSTR(t, \'[^,]+\', 1, n).', "SELECT REGEXP_SUBSTR(EMAIL, '@(.+)$', 1, 1, NULL, 1) AS DOMAIN FROM EMPLOYEES"],
['REGEXP_REPLACE', 'Text', 'REGEXP_REPLACE(text, pattern [, replacement [, start [, occurrence]]])', 'Replaces every match (occurrence = only the n-th). \\1 in the replacement refers to a group.', "SELECT REGEXP_REPLACE(PHONE, '[^0-9]') FROM EMPLOYEES"],
['REGEXP_INSTR / REGEXP_COUNT', 'Text', 'REGEXP_INSTR(text, pattern), REGEXP_COUNT(text, pattern)', 'Position of the first match (0 when none) / number of matches.', "SELECT REGEXP_COUNT(NOTES, '[0-9]+') FROM EMPLOYEES"],
// ---- null / logic ----
['NVL / COALESCE', 'Null & logic', 'NVL(a, b), COALESCE(a, b, ...)', 'b when a is NULL / the first non-NULL argument.', "SELECT NVL(NICKNAME, FIRST_NAME) FROM EMPLOYEES"],
['NVL2', 'Null & logic', 'NVL2(a, if_not_null, if_null)', 'One value when a is not NULL, another when it is.', "SELECT NVL2(END_DATE, 'Left', 'Active') FROM EMPLOYEES"],
['NULLIF', 'Null & logic', 'NULLIF(a, b)', 'NULL when a = b, otherwise a (handy to avoid divide by zero).', 'SELECT PAY / NULLIF(HOURS, 0) FROM EMPLOYEE_HOURS'],
['DECODE', 'Null & logic', 'DECODE(expr, search1, result1 [, search2, result2 ...] [, default])', 'Compares expr with each search value and returns the matching result (NULL matches NULL).', "SELECT DECODE(TO_CHAR(WORK_DATE, 'Q'), '1', 'Q1', '2', 'Q2', '3', 'Q3', 'Q4') FROM EMPLOYEE_HOURS"],
['LNNVL', 'Null & logic', 'LNNVL(condition)', 'True when the condition is false or unknown (NULL).', 'WHERE LNNVL(HOURS > 40)'],
// ---- conversion ----
['TO_CHAR', 'Conversion', "TO_CHAR(x [, 'format'])", "Date or number as text. Dates: YYYY, MM, MON, MONTH, DD, DY, DAY, HH24, MI, SS, Q, IW ... ('FM' drops padding). Numbers: 9, 0, ., ,, $, FM.", "SELECT TO_CHAR(WORK_DATE, 'YYYY-MM'), TO_CHAR(PAY, 'FM999,990.00') FROM EMPLOYEE_HOURS"],
['TO_DATE', 'Conversion', "TO_DATE(text [, 'format'])", 'Parses text into a date (with a time when the format has one); fails when it does not match. NULL instead: CAST(text AS DATE DEFAULT NULL ON CONVERSION ERROR) or a CASE with REGEXP_LIKE.', "SELECT TO_DATE('10/08/2026', 'MM/DD/YYYY') FROM DUAL"],
['TO_TIMESTAMP', 'Conversion', "TO_TIMESTAMP(text [, 'format'])", 'Parses text into a timestamp (FF = fractional seconds).', "SELECT TO_TIMESTAMP('2026-10-08 14:30:00', 'YYYY-MM-DD HH24:MI:SS') FROM DUAL"],
['TO_NUMBER', 'Conversion', "TO_NUMBER(text [, 'format'])", 'Parses text into a number.', "SELECT TO_NUMBER('1,234.50', '9,999.99') FROM DUAL"],
// ---- dates ----
['SYSDATE / CURRENT_DATE', 'Date', 'SYSDATE | CURRENT_DATE', 'Current date and time (a DATE holds a time). Today with no time: TRUNC(SYSDATE).', 'SELECT SYSDATE, TRUNC(SYSDATE) FROM DUAL'],
['SYSTIMESTAMP / CURRENT_TIMESTAMP', 'Date', 'SYSTIMESTAMP | CURRENT_TIMESTAMP', 'Current date and time as a timestamp.', 'SELECT SYSTIMESTAMP FROM DUAL'],
['TRUNC (date)', 'Date', "TRUNC(d [, 'format'])", "Rounds down to the start of the day (default), 'MM' month, 'Q' quarter, 'YYYY' year, 'IW' ISO week (Monday), 'HH24' hour or 'MI' minute.", "SELECT TRUNC(WORK_DATE, 'MM') AS MONTH, SUM(HOURS) FROM EMPLOYEE_HOURS GROUP BY TRUNC(WORK_DATE, 'MM')"],
['ROUND (date)', 'Date', "ROUND(d [, 'format'])", 'Rounds to the nearest day (default) or format unit.', "SELECT ROUND(CLOCK_IN, 'HH24') FROM EMPLOYEE_HOURS"],
['Date difference', 'Date', 'd1 - d2 | MONTHS_BETWEEN(d1, d2)', 'Days between two dates as a number (fractions = part days); MONTHS_BETWEEN gives months. Years: MONTHS_BETWEEN(...) / 12.', "SELECT TRUNC(SYSDATE) - HIRE_DATE AS DAYS_EMPLOYED, TRUNC(MONTHS_BETWEEN(SYSDATE, HIRE_DATE) / 12) AS YEARS FROM EMPLOYEES"],
['ADD_MONTHS', 'Date', 'ADD_MONTHS(d, n)', 'Adds n months (negative subtracts); month ends stay month ends. Days: d + n; hours: d + n / 24.', 'SELECT ADD_MONTHS(HIRE_DATE, 6), WORK_DATE + 14 FROM EMPLOYEES'],
['MONTHS_BETWEEN', 'Date', 'MONTHS_BETWEEN(d1, d2)', 'Months from d2 to d1 (fractional).', 'SELECT MONTHS_BETWEEN(SYSDATE, HIRE_DATE) FROM EMPLOYEES'],
['LAST_DAY', 'Date', 'LAST_DAY(d)', 'Last day of the date\'s month.', 'SELECT LAST_DAY(WORK_DATE) FROM EMPLOYEE_HOURS'],
['NEXT_DAY', 'Date', "NEXT_DAY(d, 'day name')", 'The first given weekday after d.', "SELECT NEXT_DAY(WORK_DATE, 'MONDAY') FROM EMPLOYEE_HOURS"],
['Date parts', 'Date', "EXTRACT(YEAR | MONTH | DAY FROM d), TO_CHAR(d, 'Q' | 'D' | 'DDD' | 'IW' | 'DAY' | 'MONTH')", 'Year / month / day as numbers, or quarter, day of week, day of year, ISO week, weekday and month names as text.', "SELECT EXTRACT(MONTH FROM WORK_DATE), TO_CHAR(WORK_DATE, 'Q'), TO_CHAR(WORK_DATE, 'FMDay') FROM EMPLOYEE_HOURS"],
// ---- script statements ----
['CREATE TABLE', 'Statement', 'CREATE [GLOBAL TEMPORARY] TABLE name (col type [DEFAULT v] [GENERATED [ALWAYS | BY DEFAULT [ON NULL]] AS IDENTITY] [NOT NULL] [PRIMARY KEY] [UNIQUE] [CHECK (...)], ...)\nCREATE TABLE name AS query', 'Creates a session table (lives while the script runs). Transform: Run Selected / Update save every CREATE TABLE name AS query as the dataset CLEAN_name (CLEAN_ added, never doubled); GLOBAL TEMPORARY tables are helpers and are not saved. A name AS query may reuse an input dataset\'s name (CREATE TABLE ORDERS AS SELECT ... FROM ORDERS saves CLEAN_ORDERS).', 'CREATE TABLE T AS SELECT * FROM EMPLOYEE_HOURS WHERE HOURS > 0;\nSELECT * FROM T'],
['GENERATED AS IDENTITY', 'Statement', 'col NUMBER GENERATED [ALWAYS | BY DEFAULT [ON NULL]] AS IDENTITY', 'An auto-numbered column: 1, 2, 3 ... filled in by INSERT.', 'CREATE TABLE LOG (ID NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY, MSG VARCHAR2(200));\nINSERT INTO LOG (MSG) VALUES (\'started\')'],
['CREATE VIEW', 'Statement', 'CREATE [OR REPLACE] [FORCE | NOFORCE] VIEW name [(cols)] AS query [WITH READ ONLY | WITH CHECK OPTION]', 'A named query used by later statements.', 'CREATE VIEW OT AS SELECT * FROM EMPLOYEE_HOURS WHERE HOURS > 40;\nSELECT COUNT(*) FROM OT'],
['DROP', 'Statement', 'DROP TABLE name [CASCADE CONSTRAINTS] [PURGE] | DROP VIEW name | DROP INDEX name', 'Removes a session table, view or index. IF EXISTS (DROP TABLE IF EXISTS t) is accepted as in Oracle 23ai.', 'DROP TABLE T PURGE'],
['ALTER TABLE', 'Statement', 'ALTER TABLE t ADD (col type ...) | MODIFY (col [type] [DEFAULT e] [NULL | NOT NULL]) | DROP COLUMN c | DROP (c1, c2) | RENAME COLUMN a TO b | RENAME TO new | ADD [CONSTRAINT n] PRIMARY KEY (...) | DROP CONSTRAINT n', 'Changes a session table\'s columns, constraints or name.', 'ALTER TABLE T ADD (PAY NUMBER(12,2));\nALTER TABLE T RENAME COLUMN HRS TO HOURS'],
['RENAME', 'Statement', 'RENAME old TO new', 'Renames a session table.', 'RENAME T TO T_OLD'],
['INSERT', 'Statement', 'INSERT INTO t [(cols)] VALUES (...) [, (...)] | INSERT INTO t [(cols)] query', 'Adds rows. To insert or update by key, use MERGE.', "INSERT INTO T (EMP_ID, HOURS) VALUES (1, 8)"],
['UPDATE', 'Statement', 'UPDATE t [alias] SET col = expr, ... [WHERE condition]', 'Changes values in matching rows. Values from another table: a correlated subquery, or MERGE.', "UPDATE T SET HOURS = 0 WHERE HOURS < 0"],
['DELETE', 'Statement', 'DELETE [FROM] t [alias] [WHERE condition]', 'Removes matching rows.', 'DELETE FROM T WHERE EMP_ID IS NULL'],
['TRUNCATE', 'Statement', 'TRUNCATE TABLE t', 'Removes all rows.', 'TRUNCATE TABLE T'],
['MERGE', 'Statement', 'MERGE INTO target [alias] USING source [alias] ON (condition)\n  WHEN MATCHED THEN UPDATE SET ... [WHERE c] [DELETE WHERE c]\n  WHEN NOT MATCHED THEN INSERT [(cols)] VALUES (...) [WHERE c]', 'Updates, deletes or inserts target rows based on a source (upsert).', 'MERGE INTO T t USING NEW_HOURS n ON (t.EMP_ID = n.EMP_ID)\nWHEN MATCHED THEN UPDATE SET t.HOURS = n.HOURS\nWHEN NOT MATCHED THEN INSERT (EMP_ID, HOURS) VALUES (n.EMP_ID, n.HOURS)'],
['CREATE INDEX', 'Statement', 'CREATE [UNIQUE | BITMAP] INDEX name ON t (col, ...)', 'Creates an index on a session table (UNIQUE enforces unique keys).', 'CREATE UNIQUE INDEX IX_EMP ON T (EMP_ID)'],
['COMMIT / ROLLBACK', 'Statement', 'COMMIT | ROLLBACK', 'ROLLBACK undoes changes since the last COMMIT (or the script start).', 'DELETE FROM T WHERE HOURS = 0;\nCOMMIT'],
['BEGIN / EXCEPTION', 'Statement', 'BEGIN stmt; ... [EXCEPTION WHEN OTHERS THEN stmt; ...] END;\n/', 'PL/SQL block: runs the EXCEPTION part when a statement fails. SQLERRM / SQLCODE describe the error; NULL; does nothing; RAISE; re-raises it. A / alone on a line ends the block.', "BEGIN\n  INSERT INTO T VALUES (1, 'x');\nEXCEPTION WHEN OTHERS THEN\n  NULL;\nEND;\n/"],
['RAISE_APPLICATION_ERROR', 'Statement', "RAISE_APPLICATION_ERROR(-20001, 'message');", 'Stops the script with an error (caught by an EXCEPTION block if inside one). Numbers -20000 .. -20999.', "BEGIN\n  RAISE_APPLICATION_ERROR(-20001, 'No rows to process');\nEND;\n/"],
['SQLERRM / SQLCODE', 'Statement', 'SQLERRM, SQLCODE', 'Inside an EXCEPTION block: the error message / number.', "BEGIN\n  DELETE FROM T WHERE 1 = 0;\nEXCEPTION WHEN OTHERS THEN\n  DBMS_OUTPUT.PUT_LINE(SQLERRM);\nEND;\n/"],
['EXECUTE IMMEDIATE', 'Statement', "EXECUTE IMMEDIATE 'statement';", 'Runs a statement given as text (inside a PL/SQL block).', "BEGIN\n  EXECUTE IMMEDIATE 'DROP TABLE T';\nEXCEPTION WHEN OTHERS THEN NULL;\nEND;\n/"],
['SQL*Plus lines', 'Statement', 'SET ... | PROMPT ... | DESC[RIBE] t', 'Accepted so scripts from SQL*Plus run as they are: SET and PROMPT are ignored, DESCRIBE lists a table\'s columns.', 'DESCRIBE EMPLOYEE_HOURS'],
['Script (;)', 'Statement', 'statement; statement; ... SELECT ...', 'Statements separated by ; run in order (a / alone on a line ends a PL/SQL block). The result is the final SELECT (or the last table created or changed).', 'CREATE TABLE T AS SELECT * FROM EMPLOYEE_HOURS;\nUPDATE T SET HOURS = 0 WHERE HOURS IS NULL;\nSELECT * FROM T'],
['Comments', 'Statement', '-- line comment\n/* block comment */', 'Ignored text.', 'SELECT 1 FROM DUAL -- one'],
].map(([n, c, s, d, x]) => ({ n, c, s, d, x })).sort((a, b) => a.n.localeCompare(b.n, undefined, { sensitivity: 'base' }));

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cats = [...new Set(L.map(e => e.c))].sort();
const $ = id => document.getElementById(id);
let cat = cats[0];   // section shown on the right (when not searching)
const open = new Set();   // expanded sections in the left tree (when not searching)
// Tree: a section click toggles it and shows it on the right; an entry click shows its section and scrolls to it.
$('cats').onclick = ev => {
  const k = ev.target.closest('[data-n]'), g = ev.target.closest('[data-c]'); if (!g) return;
  const c = g.dataset.c;
  if (k) { if (!$('q').value.trim()) { cat = c; draw(); } document.querySelector(`.e[data-n="${CSS.escape(k.dataset.n)}"]`)?.scrollIntoView(); return; }
  open.has(c) ? open.delete(c) : open.add(c); cat = c; draw(); $('list').scrollTop = 0;
};

// Search: every word must appear somewhere in the entry. Sections with hits open in the tree, everything else is hidden,
// and the right shows every hit under its section heading.
function draw() {
  const words = $('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const rx = words.length ? new RegExp('(' + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi') : null;
  const hl = s => rx ? esc(s).replace(rx, '<mark>$1</mark>') : esc(s);
  const hit = e => words.every(w => (e.n + ' ' + e.c + ' ' + e.s + ' ' + e.d + ' ' + e.x).toLowerCase().includes(w));
  const by = cats.map(c => [c, L.filter(e => e.c === c && hit(e))]).filter(([, es]) => es.length);
  $('cats').innerHTML = by.map(([c, es]) => `<div class="grp${words.length || open.has(c) ? ' open' : ''}" data-c="${esc(c)}"><div class="node${!words.length && c === cat ? ' on' : ''}">${Icons.caret(0, 'tw')}<span>${hl(c)}</span><small>${es.length}</small></div><div class="kids">${
    es.map(e => `<div class="node" data-n="${esc(e.n)}"><span>${hl(e.n)}</span></div>`).join('')}</div></div>`).join('');
  const show = words.length ? by : by.filter(([c]) => c === cat);
  $('list').innerHTML = show.map(([c, es]) => (words.length ? `<h2>${esc(c)}</h2>` : '') +es.map(e => `<div class="e" data-n="${esc(e.n)}"><h3>${hl(e.n)}</h3><p>${hl(e.d)}</p>
    <div class="lbl">Syntax</div><pre class="syn">${hl(e.s)}</pre><button class="ghost cp" data-x="${esc(e.s)}">Copy</button>
    <div class="lbl">Example</div><pre>${hl(e.x)}</pre><button class="ghost cp" data-x="${esc(e.x)}">Copy</button></div>`).join('')).join('') || '<div class="empty">No matches.</div>';
}
$('list').onclick = ev => { const b = ev.target.closest('[data-x]'); if (!b) return; navigator.clipboard.writeText(b.dataset.x).then(() => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1000); }); };
// Searching scrolls the right side to the first match.
$('q').oninput = () => { draw(); const m = $('list').querySelector('mark'); m ? m.scrollIntoView({ block: 'center' }) : $('list').scrollTop = 0; };
// Ctrl + wheel scrolls 4x faster instead of zooming (the global rule from ui/js/core/embed.js, which this window does not load).
addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); (e.target.closest('.tree, .main') || $('list')).scrollBy({ top: e.deltaY * 4 }); }, { passive: false });
draw();
</script>
</body>
