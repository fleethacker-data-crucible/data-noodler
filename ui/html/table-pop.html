<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table</title>
<script src="../js/core/theme.js"></script>
<script src="../js/core/no-autofill.js"></script>
<link rel="stylesheet" href="../css/theme.css">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); }
  .pop { display: flex; flex-direction: column; height: 100%; padding: 12px 16px; box-sizing: border-box; gap: 6px; }
  .pop h2 { margin: 0; font-size: 15px; flex: none; }
  #body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #body > .pgrid { flex: 1; min-height: 0; }
  #body .dt-pop { display: none; }   /* already popped out */
  .note { height: 100%; display: grid; place-items: center; color: var(--muted); }
</style>
</head>
<body>
<div class="pop"><h2 id="h"></h2><div id="body"></div></div>
<!-- Pop-out of a table (ui/js/grid/data-table.js popOut): the opener moves its own table element into #body and takes it back when this window closes. -->
</body>
</html>
