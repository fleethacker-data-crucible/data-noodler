  .wf .c { width: 40px; height: 40px; border-radius: 50%; box-sizing: border-box; border: 3px solid var(--idle); background: var(--bg);

  .wf .ar { flex: none; width: 5px; height: 40px; position: relative; }
  .wf .ar::before { content: ""; position: absolute; left: -28px; right: -28px; top: 18px; height: 3px; background: var(--idle); transition: background .3s; }

  .pp-name { cursor: text; }
  .pp-title-in { width: 100%; box-sizing: border-box; height: 34px; font-size: 20px; font-weight: 700; padding: 0 8px; }
  .pp-ids { display: flex; gap: 16px; margin: -8px 0 14px; font-size: 11px; color: var(--muted); font-family: var(--mono, monospace); }
  /* Every value starts at the same x (names, %, badges); the green + sits in the gap to its left. Lists: one name per line. */
  .pp-prop { align-items: flex-start; }
  .pp-prop > .pico, .pp-prop .k { margin-top: 7px; }
  .pp-prop .v { position: relative; padding: 6px 0 6px 24px; white-space: normal; overflow: visible; line-height: 18px; }

  .pp-plus { position: absolute; left: 0; top: 7px; display: grid; place-items: center; cursor: pointer; }

  .pp-pick { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .pp-pick:hover { filter: brightness(1.2); }
  .pp-car { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid var(--muted); }
  .ppmenu { position: fixed; z-index: 70; min-width: 120px; max-height: 280px; overflow: auto; padding: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 4px; box-shadow: 0 10px 30px #0008; }
  .ppmenu > div { padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .ppmenu > div:hover { background: color-mix(in srgb, var(--panel) 80%, #fff); }
  .ppmenu > div.on { outline: 1px solid var(--blue); }
  .pp-desc { cursor: text; }
  .pp-desc-in { width: 100%; box-sizing: border-box; min-height: 64px; resize: vertical; font: inherit; font-size: 13px; padding: 6px 8px; }
</style>

    help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.5V14M12 17.5v.01"/>',
    chat: '<path d="M4 5h16v11H9l-5 4z"/>', server: '<rect x="3" y="3" width="18" height="7" rx="1.5"/><rect x="3" y="14" width="18" height="7" rx="1.5"/><path d="M7 6.5h.01M7 17.5h.01"/>', info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/>',
    trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>',
    close: '<path d="M15 6l-6 6 6 6"/>', down: '<path d="M6 9l6 6 6-6"/>', plus: '<path d="M12 5v14M5 12h14"/>',
  };
  const svg = k => `<svg class="nico" viewBox="0 0 24 24">${I[k]}</svg>`;
  let workspaces = [], wsSel = null;   // [{ id, name, folder }] from workspace/workspaces.json; wsSel = the selected one's folder
  const loadWs = async () => { workspaces = await Projects.workspaces(); renderSide(); };
  const sec = (id, icon, label, add, items) => `<div class="ngrp" data-sec="${id}"><div class="nrow" data-tog="${id}">${svg(icon)}<span>${label}</span><span class="ncar">${svg('down')}</span>${add ? `<span class="nadd" data-add="${id}" title="New ${label.toLowerCase()}">${svg('plus')}</span>` : ''}</div><div class="nitems">${items}</div></div>`;
  function renderSide() {
    $('side').innerHTML = `<div class="nhead"><b>Menu</b><button class="nx" id="sideX" title="Close the side panel">${svg('close')}</button></div>
      <div class="nrow${wsSel ? '' : ' on'}" data-go="projects">${svg('proj')}<span>Projects</span></div>
      <div class="nrow" data-go="bookmarks">${svg('mark')}<span>Bookmarks</span></div>
      <div class="nrow" data-go="trash">${svg('trash')}<span>Trash</span></div>`
      + sec('teams', 'team', 'Teams', true, '<div class="nnone">No teams yet</div>')
      + sec('workspace', 'ws', 'Workspace', true, workspaces.map(w => `<div class="nrow nws${wsSel === w.folder ? ' on' : ''}" data-go="ws:${UI.esc(w.folder)}" title="${UI.esc(w.name)} (workspace/${UI.esc(w.folder)})">${w.folder === Projects.BUILTIN_WS ? '' : `<span class="nwdel" data-wsdel="${UI.esc(w.folder)}" title="Delete ${UI.esc(w.name)}">${svg('trash')}</span>`}<span>${UI.esc(w.name)}</span></div>`).join('') || '<div class="nnone">No workspaces yet</div>')
      + sec('help', 'help', 'Help', false, `<div class="nrow" data-go="server">${svg('server')}<span>Server Control</span></div><div class="nrow" data-go="gethelp">${svg('info')}<span>Get Help</span></div>`);
  }
  renderSide();
  $('side').onclick = async e => {
    if (e.target.closest('#sideX')) return $('side').classList.add('nclosed');
    const add = e.target.closest('[data-add]');
    if (add) {
      e.stopPropagation();
      if (add.dataset.add === 'workspace') {   // a folder workspace/<name in lower case, spaces -> dashes> with its workspace.json (UUID)
        const v = await UI.form('New workspace', [{ name: 'name', label: 'Name', required: true }], { ok: 'Create' });
        const n = String(v?.name ?? v?.values?.name ?? '').trim(); if (!n) return;
        try { const w = await Projects.createWorkspace(n); wsSel = w.folder; await loadWs(); ProjectsView.setWorkspace(w.folder); UI.toast(`Workspace ${w.name} created (workspace/${w.folder})`, 'ok'); }
        catch (err) { UI.toast(err.message, 'err'); }
      }
      return;
    }
    const del = e.target.closest('[data-wsdel]');
    if (del) {
      e.stopPropagation();
      const w = workspaces.find(x => x.folder === del.dataset.wsdel); if (!w) return;
      const ask = UI.dialog('Delete workspace', `<div class="err">Are you sure you want to delete the <b>${UI.esc(w.name)}</b> workspace?</div>
        <div class="muted">Deleting an entire workspace will move the workspace to the trash. You can restore it by clicking Trash and restoring it.</div>`,
        [{ label: 'Cancel', value: false, kind: 'ghost' }, { label: 'Delete', value: true, kind: 'danger' }]);
      [...document.querySelectorAll('dialog')].pop()?.classList.add('flash');   // flashes red
      if (!await ask) return;
      try { await Projects.deleteWorkspace(w.folder); UI.toast(`Workspace ${w.name} moved to the trash`, 'ok'); if (wsSel === w.folder) { wsSel = null; ProjectsView.setWorkspace(null); } await loadWs(); }
      catch (err) { UI.toast(err.message, 'err'); }
      return;
    }
    const tog = e.target.closest('[data-tog]');
    if (tog) return tog.parentElement.classList.toggle('nshut');
    const go = e.target.closest('[data-go]');
    if (!go) return;
    if (go.dataset.go === 'trash') return openTrash();
    if (go.dataset.go === 'server') return fetch('/api/panel', { method: 'POST', headers: { 'X-DN-Token': window.DN_TOKEN || '' } }).catch(() => {});   // the server control window
    $('side').querySelectorAll('.nrow.on').forEach(x => x.classList.remove('on')); go.classList.add('on');
    // Projects = every workspace; a workspace = only its projects (new projects go there).
    if (go.dataset.go === 'projects') { wsSel = null; ProjectsView.setWorkspace(null); }
    else if (go.dataset.go.startsWith('ws:')) { wsSel = go.dataset.go.slice(3); ProjectsView.setWorkspace(wsSel); }
  };
  // Resize: within 8px of the panel's right border (either side) the cursor switches; drag to set the width (160 - 600px, on the grid).
  const side = $('side'), near = x => !side.classList.contains('nclosed') && Math.abs(x - side.getBoundingClientRect().right) <= 8;
  // Widths snap so the right border sits on a vertical grid line (the grid is locked to the window's centre line).
  const snapW = w => { const off = ($('stage').clientWidth / 2) % G; let s = Math.round((w - off) / G) * G + off; while (s < 160) s += G; while (s > 600) s -= G; return Math.round(s); };   // whole pixels: a 1px border never blurs to 2
  side.style.width = snapW(side.offsetWidth) + 'px';
  let drag = null;
  addEventListener('pointermove', e => {
    if (drag) { side.style.width = snapW(drag.w + e.clientX - drag.x) + 'px'; return; }
    document.body.classList.toggle('navrz', near(e.clientX) && e.clientY > 72);
  });
  addEventListener('pointerdown', e => {
    if (e.button || !near(e.clientX) || e.clientY <= 72) return;
    e.preventDefault(); drag = { x: e.clientX, w: side.offsetWidth }; document.body.classList.add('navdrag');
  }, true);
  addEventListener('pointerup', () => { if (drag) { drag = null; document.body.classList.remove('navdrag'); } });
  // Trash: projects and workspaces moved to workspace/.trash; restore the ticked ones, or empty it (typed acknowledgement).
  async function openTrash() {
    for (;;) {
      const items = (await Projects.trashList()).sort((a, b) => b.trashed.localeCompare(a.trashed));
      const body = items.length
        ? `<div class="trash-list">${items.map(t => `<label><input type="checkbox" name="pick" value="${UI.esc(t.id)}"> ${UI.esc(t.name)} <span class="muted">(${t.kind === 'workspace' ? 'workspace' : 'project'})</span><small>trashed ${UI.date(t.trashed)}</small></label>`).join('')}</div>`
        : '<div class="muted">The trash is empty.</div>';
      const picked = f => [...f.querySelectorAll('input[name=pick]:checked')].map(c => c.value);
      const act = await UI.dialog('Trash', body, items.length
        ? [{ label: 'Close', value: null, kind: 'ghost' }, { label: 'Empty Trash', value: 'empty', kind: 'danger' }, { label: 'Restore Selected', value: f => ({ restore: picked(f) }) }]
        : [{ label: 'Close', value: null }]);
      if (!act) return;
      if (act === 'empty') {
        const p = UI.dialog('Empty trash', `<div>Are you sure you want to empty the trash?</div>
          <div class="err"><b>WARNING:</b> This will permanently delete all ${items.length} item(s) in the trash. This cannot be undone.</div>
          <label class="field">Type I Acknowledge to continue<input type="text" class="ack" autocomplete="off" spellcheck="false"></label>`,
          [{ label: 'Cancel', value: false, kind: 'ghost' }, { label: 'Empty', value: true, kind: 'danger' }]);
        const d = [...document.querySelectorAll('dialog')].pop(), ok = d.querySelector('footer button.danger'), ack = d.querySelector('.ack');
        ok.disabled = true; ack.oninput = () => { ok.disabled = ack.value.trim().toLowerCase() !== 'i acknowledge'; };
        d.classList.add('flash');
        if (!await p) continue;
        const r = await Projects.emptyTrash(); UI.toast(`Trash emptied: ${r.deleted} item(s) permanently deleted`, 'ok'); return;
      }
      if (!act.restore.length) { UI.toast('Tick at least one item to restore.', 'err'); continue; }
      for (const id of act.restore) {
        try { const r = await Projects.restore(id); UI.toast(r.workspace ? `Workspace restored (workspace/${r.workspace})` : `Project restored (workspace/${r.folder})`, 'ok'); }
        catch (err) { UI.toast(err.message, 'err'); }
      }
      await loadWs(); ProjectsView.reload();
    }
  }
  $('sidetab').innerHTML = `<svg class="nico" viewBox="0 0 24 24" style="transform: scaleX(-1)">${I.close}</svg>`;   // the panel's collapse icon, mirrored to point out
  $('sidetab').onclick = () => $('side').classList.remove('nclosed');
  // Projects view: the list starts at the side panel's right edge; it narrows while a project pane is open.
  const navW = () => $('stage').style.setProperty('--navw', side.classList.contains('nclosed') ? '0px' : side.offsetWidth + 'px');
  new MutationObserver(navW).observe(side, { attributes: true, attributeFilter: ['class', 'style'] });
  new MutationObserver(() => $('stage').classList.toggle('pane-open', $('ppane').classList.contains('open'))).observe($('ppane'), { attributes: true, attributeFilter: ['class'] });
  navW();
  ProjectsView.onTrash = () => openTrash();
  ProjectsView.init($('plist'), $('ppane'));
  loadWs();
  // Grid: 24px cells with a line locked to the centre of the window.
  const fit = () => { const st = $('stage'); st.style.setProperty('--gp', `${(st.clientWidth / 2) % G}px 0`); side.style.width = snapW(side.offsetWidth) + 'px'; };   // the grid moves with the window: keep the panel's edge on it
  new ResizeObserver(fit).observe($('stage')); fit();
})();
</script>
</body>
</html>
