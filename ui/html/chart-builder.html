<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chart Builder</title>
<script src="../js/core/embed.js"></script>
<script src="../js/core/theme.js"></script>
<script src="../js/core/no-autofill.js"></script>
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/chart-studio.css">
</head>
<body>
<div class="cb empty" id="cb">

  <main class="stage" id="stage">
    <div class="tools" id="tools">
      <button id="new" class="ghost" title="Start a new chart">New</button>
      <div class="dd-wrap"><button id="open" class="ghost" style="width:100%">Open ▾</button><div class="dd-menu" id="openmenu"></div></div>
      <button id="save" class="ghost" title="Save the chart (work in progress: not on the Dashboard yet)">Save</button>
      <button id="codeBtn" class="ghost" title="See and edit the chart's D3 code, or paste code from the web">Code</button>
      <button id="del" class="ghost danger" title="Delete this chart from Chart Builder (the dev folder only: a published copy stays on the Dashboard Builder)">Delete</button>
      <button id="publish" title="Save, then put the chart in the Dashboard Builder (published charts)">Publish</button>
    </div>
    <div class="slots" id="slots"></div>
    <div class="types typebar" id="types"></div>
    <input id="name" class="cname" type="text" placeholder="Enter a Chart name" spellcheck="false" title="Chart name (required to Save / Publish)">
    <div class="card" id="card"><div class="pv" id="pv"></div><div class="rz nw" data-dir="nw" title="Drag to try other sizes"></div><div class="rz n" data-dir="n" title="Drag to try other sizes"></div><div class="rz ne" data-dir="ne" title="Drag to try other sizes"></div><div class="rz e" data-dir="e" title="Drag to try other sizes"></div><div class="rz se" data-dir="se" title="Drag to try other sizes"></div><div class="rz s" data-dir="s" title="Drag to try other sizes"></div><div class="rz sw" data-dir="sw" title="Drag to try other sizes"></div><div class="rz w" data-dir="w" title="Drag to try other sizes"></div><div class="sz" id="sz"></div></div>
    <div class="status" id="status"></div>
  </main>

  <aside class="right float" id="cset">
    <div class="dw-head" id="csetHead"><b>Chart Settings</b><button class="dw-x" id="csetX" title="Close (right-click the chart > Chart Settings opens it again)">×</button></div>
    <div class="cs-body">
    <details class="sec" open id="xBox"><summary>Chart</summary>
      <div id="optsX"></div></details>
    <details class="sec" open id="yBox"><summary>Y-Axis</summary>
      <div id="optsY"></div></details>
    <details class="sec" open><summary>Colors</summary>
      <div class="swatches" id="colours"></div></details>
    <details class="sec" open hidden id="setBox"><summary>Settings</summary>
      <div id="opts"></div></details>
    <details class="sec" open id="orderBox" hidden><summary>Order</summary>
      <div class="row2"><select id="sort"><option value="desc">Largest first</option><option value="asc">Smallest first</option><option value="label">A to Z / in order</option></select>
        <input id="top" type="number" min="1" max="100000" title="How many categories to show"></div></details>
    <div class="badge-custom" id="custom" hidden>Custom code: the chart type no longer rewrites it.</div>
    </div>
  </aside>
</div>
<div class="dd-menu ctxmenu" id="ctxmenu">
  <div data-act="settings">Chart Settings<small>The chart's settings in their own window</small></div>
  <div data-act="data">Edit Data<small>Datasets and their fields: drag a field onto X or Y</small></div>
</div>

<script src="../js/dn-fs.js"></script>
<script src="../js/core/ui.js"></script>
<script src="../js/core/menus.js"></script>
<script src="../js/core/projects.js"></script>
<script src="../js/core/engine-client.js"></script>
<script src="../js/charts/color-picker.js"></script>
<script src="../js/charts/chart-panel.js"></script>
<script src="../js/charts/data-window.js"></script>
<script src="../js/vendor/d3.min.js"></script>
<script src="../js/charts/d3-render.js"></script>
<script src="../js/charts/apex-widget.js"></script>
<script src="../js/chartbuilder/templates.js"></script>
<script src="../js/chartbuilder/builder.js"></script>
</body>
</html>
