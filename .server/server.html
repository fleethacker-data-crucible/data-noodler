<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Data Noodler Server</title>
  <style>
@font-face { font-family: 'Exo 2'; font-weight: 400; src: url(fonts/exo2-400.ttf) format('truetype'); }
@font-face { font-family: 'Exo 2'; font-weight: 600; src: url(fonts/exo2-600.ttf) format('truetype'); }
@font-face { font-family: 'Syne Mono'; src: url(fonts/SyneMono-Regular.ttf) format('truetype'); }

:root {
  --bg: #fcfcfb; --panel: #f4f4f2; --border: #dddcd6; --sel: #dcdbd5;
  --text: #0b0b0b; --text-2: #52514e; --muted: #85837c;
  --blue: #2a78d6; --blue-h: #1f66bd; --ok: #0a7a3d; --warn: #a8850f; --err: #c42b2b;
  --pink: #d63a8a; --lerr: #e06060; --time: #a3a19a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a19; --panel: #242422; --border: #3a3936; --sel: #44433f;
    --text: #ffffff; --text-2: #c3c2b7; --muted: #8d8b82;
    --blue: #3987e5; --blue-h: #5a9cec; --ok: #4cc27f; --warn: #d9b343; --err: #e24c4c;
    --pink: #f27ab8; --lerr: #ff9090; --time: #aeaca4;
  }
}

* { box-sizing: border-box; }
html { color-scheme: dark; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: transparent; border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; }
.sb-near::-webkit-scrollbar-thumb { background: #3a3936; background-clip: padding-box; }
.sb-near::-webkit-scrollbar-thumb:hover { background: #55534e; background-clip: padding-box; }
::-webkit-scrollbar-corner { background: transparent; }
html, body { height: 100%; margin: 0; }
body {
  font-family: 'Exo 2', system-ui, sans-serif; font-size: 14px;
  background: var(--bg); color: var(--text);
  display: flex; flex-direction: column; padding: 0; gap: 0;
}
.mono { font-family: 'Syne Mono', ui-monospace, Consolas, monospace; font-size: 14px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; }
h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text-2); margin: 0 0 10px; display: flex; align-items: center; gap: 10px; }
a { color: var(--blue); }

header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center;
  background: var(--blue); color: #fff; font-weight: 600; font-size: 16px;
}
.sub { color: var(--muted); font-size: 12px; }

#s-status.on { color: var(--ok); } #s-status.off { color: var(--err); }


main { flex: 1; min-height: 0; display: grid; grid-template-columns: 365px 1fr; gap: 0; }
aside { display: flex; flex-direction: column; gap: 40px; overflow: auto; padding: 20px 25px 20px 20px; border-right: 1px solid var(--border); }
.panel { background: none; border: 0; padding: 0; margin: 0; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: none; border: 0; padding: 0; margin: 0; min-width: 0; }
.stat label { display: block; font-size: 12px; color: var(--muted); }
.stat.wide { grid-column: 1 / -1; }
.stat b { display: block; font-size: 18px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.field { display: block; color: var(--text-2); margin-bottom: 12px; }
input[type=text] {
  display: block; width: 100%; margin-top: 4px; height: 25px; padding: 0 8px;
  font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--border); border-radius: 4px;
}
input:focus { outline: 2px solid var(--blue); outline-offset: -1px; }

.pages { margin-top: 4px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); max-height: 320px; overflow: auto; }
.pages div { display: flex; justify-content: space-between; padding: 5px 8px; cursor: pointer; color: var(--text); }
.pages div + div { border-top: 1px solid var(--border); }
.pages div:hover { background: var(--panel); }
.pages div.sel { background: var(--sel); }
.pages div small { opacity: .7; }

.row { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 8px; }
#toggle { grid-column: 1 / -1; }
/* Fixed 40px gaps: last button row -> Port, Randomize -> Module, however many action buttons show. */
.panel > .row:last-child { margin-bottom: 0; }
#actions:not(:has(> :not([hidden]))) { display: none; }
.panel > .row:has(+ #actions:not(:has(> :not([hidden])))) { margin-bottom: 0; }
#random-row { margin-bottom: 40px; }
button {
  text-transform: capitalize;
  height: 25px; line-height: 1; padding: 0 14px 2px; border: 0; border-radius: 4px;
  background: var(--blue); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
}
button:hover { background: var(--blue-h); }
button.danger { background: var(--err); }
button.danger:hover { filter: brightness(1.1); }
button.go { background: var(--ok); }
button.go:hover { filter: brightness(1.1); }
button:disabled, button:disabled:hover { background: var(--sel); color: var(--muted); cursor: default; filter: none; }
button[hidden] { display: none; }

.logpanel { position: relative; display: flex; flex-direction: column; overflow: hidden; padding: 20px 20px 20px 25px; }
.loghead, .log .r { display: grid; grid-template-columns: 20ch 70px 50px 90px 60px minmax(0, 1fr); gap: 10px; }
.loghead { color: var(--muted); padding: 0 0 6px; }
.log { flex: 1; overflow-y: auto; overflow-x: hidden; }
.log .r { line-height: 1.6; }
.log .r > span { min-width: 0; overflow-wrap: anywhere; }
.log .t { color: var(--time); }
.log .m { color: var(--blue); }
.log .s, .log .ms { color: var(--text-2); }
.log .c2, .log .c3 { color: var(--ok); } .log .c4 { color: var(--warn); } .log .c5 { color: var(--lerr); }
.log .sys { color: var(--pink); grid-column: 2 / -1; }
.log .err { color: var(--lerr); grid-column: 2 / -1; }
.log .r.start, .log .r.stop { color: #fff; border-radius: 4px; margin: 0 -6px; padding: 0 6px; }
.log .r.start { background: var(--ok); }
.log .r.c4xx { background: #d9822b; color: #fff; border-radius: 4px; margin: 0 -6px; padding: 0 6px; }
.log .r.c4xx span { color: #fff; }
.log .r.stop { background: var(--err); }
.log .r.start .t, .log .r.stop .t { color: #fff; opacity: .85; }
.log .start, .log .stop { grid-column: 2 / -1; }
.log .client { color: var(--text-2); grid-column: 2 / -1; }
.notes { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: min(520px, 90%); z-index: 11; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.note { pointer-events: auto; position: relative; color: #fff; font-weight: 600; padding: 10px 34px 10px 14px; border-radius: 6px; box-shadow: 0 4px 14px #0006; animation: drop .25s ease-out; }
.note.ok { background: var(--ok); } .note.warn { background: #d9822b; } .note.err { background: var(--err); } .note.sys { background: var(--pink); }
.note .x { position: absolute; top: 4px; right: 8px; background: none; border: 0; padding: 0; height: auto; color: #fff; font-size: 18px; line-height: 1; cursor: pointer; }
.note .x:hover { background: none; opacity: .8; }
@keyframes drop { from { transform: translateY(-100%); opacity: 0; } to { transform: none; opacity: 1; } }
.overlay { position: fixed; inset: 0; background: #0009; display: grid; place-items: center; z-index: 10; }
.overlay[hidden] { display: none; }
.dialog.users { width: min(640px, calc(100vw - 40px)); max-height: calc(100vh - 40px); display: flex; flex-direction: column; }
.uadd { display: grid; grid-template-columns: 1fr 1fr 44px 80px auto; gap: 6px; margin-bottom: 12px; }
.uadd input, .uedit input { margin-top: 0; }
.mi { text-align: center; text-transform: uppercase; }
select { height: 25px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; }
.ulist { flex: 1; min-height: 60px; overflow: auto; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); margin-bottom: 12px; }
.ulist .u + .u { border-top: 1px solid var(--border); }
.ulist .uname { padding: 6px 8px; cursor: pointer; }
.ulist .uname:hover { background: var(--panel); }
.ulist .u.open > .uname { background: var(--sel); font-weight: 600; }
.ubtns { display: flex; justify-content: space-between; padding: 6px 8px; }
.uedit { display: grid; grid-template-columns: 1fr 1fr 44px 80px auto; gap: 6px; padding: 0 8px 8px; }
.uhint { color: var(--muted); font-size: 12px; margin: -6px 0 10px; }
.uempty { padding: 6px 8px; color: var(--muted); }
.dialog { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px 24px; width: 300px; }
.dialog b { display: block; font-size: 16px; font-weight: 600; margin-bottom: 14px; }
.dialog .row { margin-bottom: 10px; }
.dialog .cancel { width: 100%; background: var(--sel); color: var(--text); }
.dialog .cancel:hover { background: var(--border); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">DN</span>
      <div>
        <h1>Data Noodler Server</h1>
        <div class="sub" id="root"></div>
      </div>
    </div>
  </header>

  <main>
    <aside>
      <section class="panel">
        <div class="stats">
        <div class="stat wide"><label>Serving Module</label><b id="s-page">-</b></div>
        <div class="stat"><label>Port</label><b id="s-port">-</b></div>
        <div class="stat"><label>Requests</label><b id="s-hits">0</b></div>
        <div class="stat"><label>Status</label><b id="s-status">CONNECTING</b></div>
        <div class="stat"><label>Uptime</label><b id="s-uptime">0:00:00</b></div>
      </div>
      </section>

      <section class="panel">
        <div class="row"><button id="toggle" class="danger">Stop server</button></div>
        <div id="actions" class="row sorted">
          <button id="clear" hidden>Clear log</button>
          <button id="users">User Access</button>
        </div>
      </section>

      <section class="panel">
        <label class="field">Port
          <input id="port" type="text" inputmode="numeric" maxlength="5" autocomplete="off" spellcheck="false">
        </label>
        <div id="random-row" class="row"><button id="random">Randomize</button></div>
        <div class="field">Module
          <div id="pages" class="pages"></div>
        </div>
        <div id="module-actions" class="row sorted">
          <button id="open" hidden>Open Module</button>
          <button id="apply">Apply</button>
          <button id="rescan">Rescan</button>
        </div>
      </section>
    </aside>

    <section class="panel logpanel">
      <div class="loghead mono"><span>TIMESTAMP</span><span>METHOD</span><span>CODE</span><span>SIZE</span><span>MS</span><span>PATH</span></div>
      <div id="notes" class="notes"></div>
      <div id="log" class="log mono"></div>
    </section>
  </main>

  <div id="picker" class="overlay" hidden>
    <div class="dialog">
      <b>Open module in</b>
      <div class="row">
        <button data-browser="chrome">Chrome</button>
        <button data-browser="edge">Edge</button>
      </div>
      <button id="pick-cancel" class="cancel">Cancel</button>
    </div>
  </div>

  <div id="udlg" class="overlay" hidden>
    <div class="dialog users">
      <b>User Access</b>
      <div class="uadd">
        <input id="u-last" type="text" placeholder="Last name" autocomplete="off">
        <input id="u-first" type="text" placeholder="First name" autocomplete="off">
        <input id="u-mid" class="mi" type="text" placeholder="MI" maxlength="1" autocomplete="off">
        <select id="u-type"><option>CIV</option><option>CTR</option><option>MIL</option><option>N/A</option></select>
        <button id="u-add" class="go">Add</button>
      </div>
      <div class="uhint">Enter Last, First, MI. Shown as: Last, First M. Type &mdash; saved to config/users.json</div>
      <div id="ulist" class="ulist"></div>
      <button id="u-close" class="cancel">Close</button>
    </div>
  </div>

  <script>
// Control panel for .server/server.ps1. The server writes every log entry to
// .server/logs/ as it happens; this panel mirrors the same entries.
const W = 1400, H = 1000;
const $ = id => document.getElementById(id);
let state = null, selPage = null, since = 0, live = false;

// Size and center the app window.
function center() {
  const w = Math.min(W, screen.availWidth), h = Math.min(H, screen.availHeight);
  try {
    window.resizeTo(w, h);
    window.moveTo((screen.availLeft || 0) + (screen.availWidth - w) / 2, (screen.availTop || 0) + (screen.availHeight - h) / 2);
  } catch {}
}
center();
addEventListener('load', center);

async function api(path, body) {
  const r = await fetch('/api/' + path, body === undefined ? {} : { method: 'POST', body: JSON.stringify(body) });
  return r.json();
}

// Send panel-side errors to the server log too.
function clientLog(level, text) {
  try { navigator.sendBeacon('/api/clientlog', JSON.stringify({ level, text })); } catch {}
}
addEventListener('error', e => clientLog('err', `Panel error: ${e.message} (${e.filename}:${e.lineno}:${e.colno})`));
addEventListener('unhandledrejection', e => clientLog('err', `Panel unhandled rejection: ${e.reason?.stack || e.reason}`));

const fmtSize = n => n >= 1048576 ? Math.ceil(n / 1048576) + ' MB' : n >= 1024 ? Math.ceil(n / 1024) + ' KB' : n + ' B';
const fmtTime = s => [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map((v, i) => i ? String(v).padStart(2, '0') : v).join(':');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function renderPages() {
  $('pages').innerHTML = state.pages.map(p =>
    `<div data-p="${esc(p.name)}" class="${p.name === selPage ? 'sel' : ''}"><span>${esc(p.name)}</span><small>${fmtSize(p.size)}</small></div>`
  ).join('') || '<div>No .html files found</div>';
}

async function loadState(resetForm) {
  state = await api('state');
  $('root').textContent = state.root;
  $('s-status').textContent = state.up ? 'ONLINE' : 'OFFLINE';
  $('s-status').className = state.up ? 'on' : 'off';
  $('toggle').textContent = state.up ? 'Stop server' : 'Start server';
  $('toggle').className = state.up ? 'danger' : 'go';
  $('s-page').textContent = state.page;
  $('s-port').textContent = state.port;
  $('s-hits').textContent = state.hits;
  $('s-uptime').textContent = fmtTime(state.uptime);
  $('open').hidden = !state.up;
  if (resetForm) { $('port').value = state.port; selPage = state.page; renderPages(); }
  syncApply();
}
// Button groups (.sorted): visible buttons stack in alphabetical order; hidden ones take no space.
document.querySelectorAll('.sorted').forEach(g => [...g.children].sort((a, b) => a.textContent.localeCompare(b.textContent)).forEach(b => g.append(b)));
const syncClear = () => { $('clear').hidden = !$('log').children.length; };
// Apply shows only when the form differs from what is being served.
function syncApply() { $('apply').hidden = !state || (selPage === state.page && +$('port').value === state.port); }

// What usually causes each failing status code (shown in its notification).
const WHY = {
  400: 'Bad request: the request was malformed or had invalid values',
  401: 'Unauthorized: missing or wrong access token',
  403: 'Forbidden: path or origin not allowed (outside the project root, dot-folder, or other site)',
  404: 'Not found: no file or API at this path',
  405: 'Method not allowed for this path',
  409: 'Conflict: the target already exists or changed',
  413: 'Too large: the request body exceeds the limit',
  416: 'Range not satisfiable: requested byte range is outside the file',
  500: 'Server error: the server failed while handling this request',
};
function addLines(lines) {
  const log = $('log');
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
  for (const l of lines) {
    const r = document.createElement('div');
    r.className = 'r' + (l.k === 'start' || l.k === 'stop' ? ' ' + l.k : '');
    if (l.k === 'req' && l.c >= 400 && l.c < 500) r.classList.add('c4xx');
    if (l.k === 'req') {
      r.innerHTML = `<span class="t">${l.t}</span><span class="m">${esc(l.m)}</span><span class="c${String(l.c)[0]}">${l.c}</span>` +
        `<span class="s">${fmtSize(l.s)}</span><span class="ms">${l.ms} ms</span><span>${esc(l.p)}</span>`;
    } else {
      r.innerHTML = `<span class="t">${l.t}</span><span class="${l.k}">» ${esc(l.p)}</span>`;
    }
    log.appendChild(r);
    if (live) {
      if (l.k === 'sys') note(l.p, 'sys');
      else if (l.k === 'err') note(l.p, 'err');
      else if (l.k === 'req' && l.c >= 400) note(`${l.c} ${WHY[l.c] || (l.c >= 500 ? 'Server error' : 'Request rejected')}: ${l.m} ${l.p}`, l.c >= 500 ? 'err' : 'warn');
    }
    since = l.i;
  }
  syncClear();
  while (log.children.length > 1500) log.firstChild.remove();
  if (atBottom) log.scrollTop = log.scrollHeight;
}

// Each poll doubles as the server's heartbeat.
async function poll() {
  try {
    const { lines } = await api('log?since=' + since);
    addLines(lines); live = true;  // history from before the panel opened does not notify
    await loadState(false);
  } catch {
    $('s-status').textContent = 'OFFLINE'; $('s-status').className = 'off';
  }
  setTimeout(poll, 1000);
}

// Drop-down notifications at the top of the live log: ok (green), warn (orange), err (red), sys (pink); 5 s or X.
// Pink (system) entries, errors and 4xx/5xx requests drop a notification; panel messages go to the log.
function msg(text, ok) { clientLog(ok === true ? 'sys' : 'err', text); }
function note(text, kind) {
  const n = document.createElement('div');
  n.className = 'note ' + kind;
  n.innerHTML = `<span>${esc(text)}</span><button class="x" title="Dismiss">&times;</button>`;
  n.querySelector('.x').onclick = () => n.remove();
  $('notes').prepend(n);
  setTimeout(() => n.remove(), 5000);
}

// Scrollbars show only while the mouse is within 15px of them.
const SB_NEAR = 15;
addEventListener('mousemove', e => {
  for (const el of document.querySelectorAll('aside, .pages, .log')) {
    const r = el.getBoundingClientRect();
    const vert = el.scrollHeight > el.clientHeight && e.clientY >= r.top && e.clientY <= r.bottom && e.clientX <= r.right && e.clientX >= r.right - (el.offsetWidth - el.clientWidth) - SB_NEAR;
    const horiz = el.scrollWidth > el.clientWidth && e.clientX >= r.left && e.clientX <= r.right && e.clientY <= r.bottom && e.clientY >= r.bottom - (el.offsetHeight - el.clientHeight) - SB_NEAR;
    el.classList.toggle('sb-near', vert || horiz);
  }
});
document.documentElement.addEventListener('mouseleave', () => document.querySelectorAll('.sb-near').forEach(el => el.classList.remove('sb-near')));

$('port').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, ''); syncApply(); });
$('port').addEventListener('keydown', e => { if (e.key === 'Enter' && !$('apply').hidden) $('apply').click(); });
$('pages').addEventListener('click', e => {
  const d = e.target.closest('[data-p]');
  if (d) { selPage = d.dataset.p; renderPages(); syncApply(); }
});
$('apply').onclick = async () => {
  const r = await api('settings', { port: +$('port').value, page: selPage });
  r.ok ? msg('Settings applied.', true) : msg(r.error, false);
  await loadState(r.ok);
};
$('rescan').onclick = async () => { const keep = selPage; await loadState(true); selPage = keep; renderPages(); syncApply(); note('Rescan completed.', 'sys'); };
$('open').onclick = () => { $('picker').hidden = false; };
$('pick-cancel').onclick = () => { $('picker').hidden = true; };
$('picker').addEventListener('click', async e => {
  if (e.target === $('picker')) { $('picker').hidden = true; return; }
  const b = e.target.dataset.browser;
  if (!b) return;
  $('picker').hidden = true;
  const r = await api('open', { browser: b });
  if (!r.ok) msg(r.error, false);
});
addEventListener('keydown', e => { if (e.key === 'Escape') { $('picker').hidden = true; $('udlg').hidden = true; } });
$('clear').onclick = async () => { await api('clear', {}); $('log').innerHTML = ''; syncClear(); note('Live logs cleared.', 'sys'); };
$('random').onclick = async () => {
  const r = await api('random', {});
  r.ok ? msg(`Now on port ${r.port}.`, true) : msg(r.error, false);
  await loadState(true);
};
$('toggle').onclick = async () => {
  const r = await api('site', { on: !state.up });
  if (!r.ok) msg(r.error, false);
  await loadState(false);
};

// Window closing: tell the server to shut down (a reload cancels it by polling again).
addEventListener('pagehide', () => navigator.sendBeacon('/api/bye'));

// ---- User Access: the shared user list (config/users.json) ----
const TYPES = ['CIV', 'CTR', 'MIL', 'N/A'];
let users = [], uOpen = null, uEdit = null;
const cap = s => s.trim() ? s.trim()[0].toUpperCase() + s.trim().slice(1) : '';
// "Last, First M. CIV" (no type for N/A).
const displayName = u => `${u.last}, ${u.first}${u.middle ? ' ' + u.middle[0].toUpperCase() + '.' : ''}${u.type && u.type !== 'N/A' ? ' ' + u.type : ''}`;
const typeOpts = t => TYPES.map(x => `<option${x === t ? ' selected' : ''}>${x}</option>`).join('');
function readUser(first, mid, last, type) {
  const u = { first: cap(first), middle: mid.replace(/[^A-Za-z]/g, '').slice(0, 1).toUpperCase(), last: cap(last), type };
  if (!u.first || !u.last) { msg('First and last name are required.', 'warn'); return null; }
  u.display = displayName(u);
  if (users.some(x => x.display === u.display && x.id !== uEdit)) { msg(`${u.display} is already in the list.`, 'warn'); return null; }
  return u;
}
async function saveUsers(text) {
  users.sort((a, b) => a.display.localeCompare(b.display));
  const r = await fetch('/api/users', { method: 'POST', body: JSON.stringify(users, null, 2) })
    .then(r => r.ok ? r.json() : { ok: false, error: `Saving users failed (HTTP ${r.status}). Restart the server to load the users API.` })
    .catch(e => ({ ok: false, error: `Saving users failed: ${e.message}` }));
  r.ok ? msg(text, true) : msg(r.error, false);
}
function renderUsers() {
  $('ulist').innerHTML = users.map(u => `<div class="u${u.id === uOpen ? ' open' : ''}" data-id="${u.id}">
    <div class="uname">${esc(u.display)}</div>
    ${u.id === uOpen ? `<div class="ubtns"><button data-a="edit">Edit</button><button data-a="del" class="danger">Delete</button></div>` : ''}
    ${u.id === uEdit ? `<div class="uedit">
      <input type="text" data-f="last" value="${esc(u.last)}" placeholder="Last name">
      <input type="text" data-f="first" value="${esc(u.first)}" placeholder="First name">
      <input type="text" class="mi" data-f="middle" value="${esc(u.middle)}" placeholder="MI" maxlength="1">
      <select data-f="type">${typeOpts(u.type)}</select>
      <button data-a="assign" class="go">Assign</button></div>` : ''}
  </div>`).join('') || '<div class="uempty">No users yet.</div>';
}
$('users').onclick = async () => {
  users = await fetch('/api/users').then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
    .catch(e => { msg(`Could not load users (${e.message}). Restart the server to load the users API.`, false); return []; });
  users.forEach((u, i) => { u.id ||= Date.now().toString(36) + i; u.display = displayName(u); });
  uOpen = uEdit = null; renderUsers();
  $('udlg').hidden = false; $('u-last').focus();
};
$('u-close').onclick = () => { $('udlg').hidden = true; };
$('udlg').addEventListener('click', e => { if (e.target === $('udlg')) $('udlg').hidden = true; });
$('u-add').onclick = async () => {
  const u = readUser($('u-first').value, $('u-mid').value, $('u-last').value, $('u-type').value);
  if (!u) return;
  u.id = Date.now().toString(36);
  users.push(u);
  ['u-first', 'u-mid', 'u-last'].forEach(id => $(id).value = '');
  renderUsers(); await saveUsers(`Added ${u.display}.`); renderUsers(); $('u-last').focus();
};
// Middle initial: one letter, capitalised as typed.
$('udlg').addEventListener('input', e => { if (e.target.classList.contains('mi')) e.target.value = e.target.value.replace(/[^A-Za-z]/g, '').slice(0, 1).toUpperCase(); });
$('udlg').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.closest('.uadd')) $('u-add').click();
  else if (e.target.closest('.uedit')) e.target.closest('.u').querySelector('[data-a=assign]').click();
});
$('ulist').addEventListener('click', async e => {
  const row = e.target.closest('.u'); if (!row) return;
  const id = row.dataset.id, u = users.find(x => x.id === id), a = e.target.dataset.a;
  if (e.target.closest('.uname')) { uOpen = uOpen === id ? null : id; uEdit = null; }
  else if (a === 'edit') uEdit = uEdit === id ? null : id;
  else if (a === 'del') {
    users = users.filter(x => x.id !== id); uOpen = uEdit = null;
    await saveUsers(`Deleted ${u.display}.`);
  } else if (a === 'assign') {
    const f = n => row.querySelector(`[data-f=${n}]`).value;
    const n = readUser(f('first'), f('middle'), f('last'), f('type'));
    if (!n) return;
    Object.assign(u, n); uEdit = null;
    await saveUsers(`Saved ${u.display}.`);
  } else return;
  renderUsers();
});

loadState(true).then(poll);
  </script>
</body>
